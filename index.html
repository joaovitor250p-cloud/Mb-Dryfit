<script>
    // Configuração Supabase (Opcional)
    const SUPABASE_URL = 'https://seu-projeto.supabase.co';
    const SUPABASE_ANON_KEY = 'sua-anon-key-aqui';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let products = [
        {
            id: 1,
            name: 'Camiseta MB Performance Pro',
            category: 'Camisetas',
            price: 119.90,
            oldPrice: 159.90,
            badge: 'MAIS VENDIDO',
            colorsData: {
                'Preto': ['https://images.unsplash.com/photo-1581655353564-df123a1eb820?auto=format&fit=crop&q=80&w=800'],
                'Laranja': ['https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&q=80&w=800']
            },
            sizes: ['P', 'M', 'G', 'GG'],
            description: 'Desenvolvida com tecnologia Dryfit Advanced, esta camiseta afasta o suor instantaneamente.'
        }
    ];

    let cart = [];
    let orders = [
        { id: 'MB-1082', customer: 'Carlos Silva', date: '08/09/2026', total: 209.80, status: 'Pago', items: '2x Produtos' }
    ];

    let selectedProductModal = null;
    let activeColorModal = '';
    let activeSizeModal = '';
    let currentCategory = 'Todos';
    let isCheckoutStep = false;

    // Variável para controlar os 5 cliques secretos no logo
    let logoClickCount = 0;
    let logoClickTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();

        // Animação da Splash Screen
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            if(splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 700);
            }
        }, 2000);

        renderProducts();

        // Configurar o gatilho secreto de 5 cliques no logotipo MB DRYFIT
        const logoBtn = document.querySelector('header button[onclick="switchTab(\'home\']")');
        if (logoBtn) {
            logoBtn.addEventListener('click', (e) => {
                logoClickCount++;
                clearTimeout(logoClickTimer);
                
                logoClickTimer = setTimeout(() => {
                    logoClickCount = 0;
                }, 800); // Reseta se demorar mais de 0.8s entre os cliques

                if (logoClickCount >= 5) {
                    logoClickCount = 0;
                    e.preventDefault();
                    switchTab('admin');
                    showToast('Painel secreto desbloqueado! 🔓');
                }
            });
        }
    });

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastText').innerText = msg;
        toast.style.opacity = '1';
        toast.style.transform = 'translate(-50%, 0)';
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translate(-50%, -16px)';
        }, 3000);
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        if (tab === 'home') document.getElementById('tabHome').classList.remove('hidden');
        if (tab === 'shop') document.getElementById('tabShop').classList.remove('hidden');
        if (tab === 'admin') document.getElementById('tabAdmin').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleMobileMenu() {
        document.getElementById('mobileMenu').classList.toggle('hidden');
    }

    function toggleSearch() {
        const s = document.getElementById('searchModal');
        s.classList.toggle('hidden');
        if(!s.classList.contains('hidden')) document.getElementById('searchInput').focus();
    }

    function handleSearch(query) {
        const resContainer = document.getElementById('searchResults');
        resContainer.innerHTML = '';
        const filtered = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()) || p.category.toLowerCase().includes(query.toLowerCase()));
        filtered.forEach(p => {
            const firstColor = Object.keys(p.colorsData)[0];
            const firstImg = p.colorsData[firstColor][0];
            resContainer.innerHTML += `
                <div onclick="openProductModal(${p.id}); toggleSearch();" class="flex items-center gap-4 bg-brand-card p-3.5 rounded-2xl border border-brand-border cursor-pointer hover:border-brand-orange transition">
                    <img src="${firstImg}" class="w-16 h-16 object-cover rounded-xl">
                    <div>
                        <h4 class="font-bold text-sm">${p.name}</h4>
                        <p class="text-brand-orange font-black text-sm">R$ ${p.price.toFixed(2)}</p>
                    </div>
                </div>
            `;
        });
    }

    function setCategory(cat) {
        currentCategory = cat;
        renderShopProducts();
    }

    function renderProducts() {
        const homeGrid = document.getElementById('homeProductsGrid');
        homeGrid.innerHTML = '';
        products.slice(0, 4).forEach(p => {
            homeGrid.innerHTML += createProductCardHTML(p);
        });
        renderShopProducts();
        lucide.createIcons();
    }

    function renderShopProducts() {
        const shopGrid = document.getElementById('shopProductsGrid');
        shopGrid.innerHTML = '';
        const filtered = currentCategory === 'Todos' ? products : products.filter(p => p.category === currentCategory);
        filtered.forEach(p => {
            shopGrid.innerHTML += createProductCardHTML(p);
        });
        lucide.createIcons();
    }

    function createProductCardHTML(p) {
        const firstColor = Object.keys(p.colorsData)[0] || 'Preto';
        const firstImg = p.colorsData[firstColor]?.[0] || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&q=80&w=800';
        return `
            <div onclick="openProductModal(${p.id})" class="bg-brand-card border border-brand-border rounded-2xl overflow-hidden group cursor-pointer hover:border-brand-orange transition duration-300 flex flex-col justify-between shadow-lg">
                <div class="relative aspect-square overflow-hidden bg-zinc-900">
                    <img src="${firstImg}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    <span class="absolute top-3 left-3 bg-brand-orange text-white text-[10px] font-black px-2.5 py-1 rounded-full uppercase shadow">${p.badge}</span>
                </div>
                <div class="p-4 flex flex-col flex-1 justify-between">
                    <div>
                        <p class="text-[11px] text-brand-grayText font-bold uppercase tracking-wider mb-1">${p.category}</p>
                        <h3 class="font-bold text-sm md:text-base line-clamp-1 group-hover:text-brand-orange transition">${p.name}</h3>
                    </div>
                    <div class="mt-4">
                        <span class="text-lg font-black text-white">R$ ${p.price.toFixed(2)}</span>
                        <p class="text-[11px] text-brand-grayText">ou 3x de R$ ${(p.price/3).toFixed(2)}</p>
                    </div>
                </div>
            </div>
        `;
    }

    function openProductModal(id) {
        const p = products.find(item => item.id === id);
        if(!p) return;
        selectedProductModal = p;
        activeColorModal = Object.keys(p.colorsData)[0];
        activeSizeModal = p.sizes[0] || 'M';

        updateModalDisplay();
        document.getElementById('productModal').classList.remove('hidden');
    }

    function updateModalDisplay() {
        const p = selectedProductModal;
        const imagesForColor = p.colorsData[activeColorModal] || Object.values(p.colorsData)[0];

        document.getElementById('modalImg').src = imagesForColor[0];
        document.getElementById('modalBadge').innerText = p.badge;
        document.getElementById('modalTitle').innerText = p.name;
        document.getElementById('modalPrice').innerText = `R$ ${p.price.toFixed(2)}`;
        document.getElementById('modalOldPrice').innerText = p.oldPrice ? `R$ ${p.oldPrice.toFixed(2)}` : '';
        document.getElementById('modalDesc').innerText = p.description;
        document.getElementById('selectedColorLabel').innerText = activeColorModal;
        document.getElementById('selectedSizeLabel').innerText = activeSizeModal;

        const colContainer = document.getElementById('modalColorOptions');
        colContainer.innerHTML = '';
        Object.keys(p.colorsData).forEach(col => {
            const isSelected = activeColorModal === col;
            colContainer.innerHTML += `
                <button onclick="changeModalColor('${col}')" class="px-4 py-2 rounded-xl text-xs font-bold border transition flex items-center gap-2 transform active:scale-95 ${isSelected ? 'bg-brand-orange border-brand-orange text-white shadow-[0_0_15px_rgba(255,101,0,0.4)] scale-105' : 'bg-brand-black border-brand-border text-brand-grayText hover:border-brand-orange'}">
                    <span class="w-3 h-3 rounded-full ${col.toLowerCase().includes('preto') ? 'bg-black border border-white' : col.toLowerCase().includes('laranja') ? 'bg-brand-orange' : 'bg-white'}"></span>
                    ${col}
                </button>
            `;
        });

        const thumbContainer = document.getElementById('modalColorsThumb');
        thumbContainer.innerHTML = '';
        imagesForColor.forEach(imgUrl => {
            thumbContainer.innerHTML += `
                <div class="w-14 h-14 rounded-xl overflow-hidden border-2 border-brand-border flex-shrink-0 cursor-pointer hover:border-brand-orange transition">
                    <img src="${imgUrl}" class="w-full h-full object-cover" onclick="document.getElementById('modalImg').src='${imgUrl}'">
                </div>
            `;
        });

        const szContainer = document.getElementById('modalSizeOptions');
        szContainer.innerHTML = '';
        p.sizes.forEach(sz => {
            const isSelected = activeSizeModal === sz;
            szContainer.innerHTML += `
                <button onclick="changeModalSize('${sz}')" class="w-12 h-12 rounded-xl font-black text-sm flex items-center justify-center transition border transform active:scale-95 ${isSelected ? 'bg-brand-orange border-brand-orange text-white shadow-lg scale-105' : 'bg-brand-black border-brand-border text-brand-grayText hover:border-brand-orange'}">
                    ${sz}
                </button>
            `;
        });

        document.getElementById('modalWhatsappBtn').href = `https://api.whatsapp.com/send?phone=5511999999999&text=Olá! Quero comprar:%0AProduto: ${encodeURIComponent(p.name)}%0ACor: ${activeColorModal}%0ATamanho: ${activeSizeModal}%0AValor: R$ ${p.price.toFixed(2)}`;
        lucide.createIcons();
    }

    function changeModalColor(col) {
        activeColorModal = col;
        updateModalDisplay();
    }

    function changeModalSize(sz) {
        activeSizeModal = sz;
        document.getElementById('selectedSizeLabel').innerText = sz;
        updateModalDisplay();
    }

    function closeProductModal() {
        document.getElementById('productModal').classList.add('hidden');
    }

    function addToCartFromModal() {
        if(!selectedProductModal) return;
        const key = `${selectedProductModal.id}-${activeColorModal}-${activeSizeModal}`;
        const existing = cart.find(i => i.cartKey === key);
        if(existing) {
            existing.qty += 1;
        } else {
            const firstImg = selectedProductModal.colorsData[activeColorModal][0];
            cart.push({
                ...selectedProductModal,
                selectedImage: firstImg,
                selectedColor: activeColorModal,
                selectedSize: activeSizeModal,
                qty: 1,
                cartKey: key
            });
        }
        showToast(`Adicionado ao carrinho: ${selectedProductModal.name} (+1)`);
        closeProductModal();
        updateCartBadge();
        toggleCart();
    }

    function updateCartBadge() {
        const badge = document.getElementById('cartBadge');
        const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
        if(totalQty > 0) {
            badge.innerText = totalQty;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }

    function toggleCart() {
        document.getElementById('cartDrawer').classList.toggle('hidden');
        renderCartItems();
    }

    function renderCartItems() {
        const container = document.getElementById('cartItemsContainer');
        container.innerHTML = '';
        if(cart.length === 0) {
            container.innerHTML = `
                <div class="text-center py-16 text-brand-grayText">
                    <i data-lucide="shopping-bag" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
                    <p class="font-bold">Seu carrinho está vazio</p>
                    <p class="text-xs mt-1">Adicione itens para continuar a compra.</p>
                </div>
            `;
            document.getElementById('cartTotalPrice').innerText = 'R$ 0,00';
            lucide.createIcons();
            return;
        }
        let total = 0;
        cart.forEach(item => {
            total += item.price * item.qty;
            container.innerHTML += `
                <div class="flex gap-4 bg-brand-black p-3.5 rounded-2xl border border-brand-border items-center">
                    <img src="${item.selectedImage}" class="w-16 h-16 object-cover rounded-xl">
                    <div class="flex-1">
                        <h4 class="font-bold text-sm line-clamp-1">${item.name}</h4>
                        <p class="text-xs text-brand-grayText">Cor: ${item.selectedColor} | Tam: ${item.selectedSize}</p>
                        <p class="text-brand-orange font-black text-sm mt-1">R$ ${item.price.toFixed(2)}</p>
                    </div>
                    <div class="flex flex-col items-end gap-2">
                        <button onclick="removeFromCart('${item.cartKey}')" class="text-zinc-500 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        <span class="text-xs font-bold bg-brand-card px-2.5 py-1 rounded-lg">Qtd: ${item.qty}</span>
                    </div>
                </div>
            `;
        });
        document.getElementById('cartTotalPrice').innerText = `R$ ${total.toFixed(2)}`;
        lucide.createIcons();
    }

    function removeFromCart(key) {
        cart = cart.filter(i => i.cartKey !== key);
        updateCartBadge();
        renderCartItems();
    }

    function proceedCheckout() {
        if(cart.length === 0) return;
        if(!isCheckoutStep) {
            isCheckoutStep = true;
            document.getElementById('cartItemsContainer').classList.add('hidden');
            document.getElementById('checkoutFormContainer').classList.remove('hidden');
            document.getElementById('cartActionButton').innerText = 'Confirmar Pedido Real';
            document.getElementById('cartActionButton').classList.replace('bg-brand-orange', 'bg-emerald-600');
        } else {
            const name = document.getElementById('chkName').value || 'Cliente Web';
            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            orders.unshift({
                id: `MB-${Math.floor(1000 + Math.random() * 9000)}`,
                customer: name,
                date: new Date().toLocaleDateString('pt-BR'),
                total: total,
                status: 'Novo',
                items: `${cart.length} itens`
            });
            showToast('Pedido realizado com sucesso! 🎉');
            cart = [];
            isCheckoutStep = false;
            document.getElementById('cartItemsContainer').classList.remove('hidden');
            document.getElementById('checkoutFormContainer').classList.add('hidden');
            document.getElementById('cartActionButton').innerText = 'Finalizar Compra Rápida';
            document.getElementById('cartActionButton').classList.replace('bg-emerald-600', 'bg-brand-orange');
            updateCartBadge();
            toggleCart();
        }
    }

    function handleSupabaseAdminLogin() {
        const email = document.getElementById('adminEmailInput').value;
        const password = document.getElementById('adminPasswordInput').value;

        if (email === 'admin@mbdryfit.com' && password === 'mbadmin2026') {
            document.getElementById('adminLoginBox').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            showToast('Painel administrativo desbloqueado!');
            renderAdminProducts();
        } else {
            showToast('Credenciais inválidas. Use: admin@mbdryfit.com / mbadmin2026');
        }
    }

    function logoutSupabaseAdmin() {
        document.getElementById('adminDashboard').classList.add('hidden');
        document.getElementById('adminLoginBox').classList.remove('hidden');
        showToast('Sessão encerrada.');
    }

    function setAdminSubView(view) {
        document.getElementById('adminProductsView').classList.add('hidden');
        document.getElementById('adminOrdersView').classList.add('hidden');
        if (view === 'products') document.getElementById('adminProductsView').classList.remove('hidden');
        if (view === 'orders') {
            document.getElementById('adminOrdersView').classList.remove('hidden');
            renderAdminOrders();
        }
    }

    function renderAdminProducts() {
        const list = document.getElementById('adminProductsList');
        list.innerHTML = '';
        products.forEach(p => {
            const firstCol = Object.keys(p.colorsData)[0];
            const firstImg = p.colorsData[firstCol][0];
            list.innerHTML += `
                <div class="flex items-center justify-between bg-brand-black p-4 rounded-2xl border border-brand-border">
                    <div class="flex items-center gap-4">
                        <img src="${firstImg}" class="w-14 h-14 object-cover rounded-xl">
                        <div>
                            <h4 class="font-bold text-sm">${p.name}</h4>
                            <p class="text-xs text-brand-grayText">Cat: ${p.category} | R$ ${p.price.toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="deleteProduct(${p.id})" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">Excluir</button>
                    </div>
                </div>
            `;
        });
        lucide.createIcons();
    }

    function openProductFormModal() {
        document.getElementById('productFormModal').classList.remove('hidden');
    }

    function closeProductFormModal() {
        document.getElementById('productFormModal').classList.add('hidden');
    }

    function saveProductToDatabase() {
        const name = document.getElementById('pName').value;
        const price = parseFloat(document.getElementById('pPrice').value);
        const category = document.getElementById('pCategory').value;
        const desc = document.getElementById('pDesc').value;

        if(!name || isNaN(price)) {
            showToast('Preencha o nome e o preço.');
            return;
        }

        const newProd = {
            id: products.length + 1,
            name,
            category,
            price,
            oldPrice: price + 30,
            badge: 'NOVO',
            colorsData: {
                'Preto': ['https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&q=80&w=800']
            },
            sizes: ['P', 'M', 'G', 'GG'],
            description: desc || 'Alta performance.'
        };

        products.unshift(newProd);
        renderAdminProducts();
        renderProducts();
        closeProductFormModal();
        showToast('Produto publicado com sucesso! 🚀');
    }

    function deleteProduct(id) {
        products = products.filter(p => p.id !== id);
        renderAdminProducts();
        renderProducts();
        showToast('Produto excluído.');
    }

    function renderAdminOrders() {
        const list = document.getElementById('adminOrdersList');
        list.innerHTML = '';
        orders.forEach(o => {
            list.innerHTML += `
                <div class="bg-brand-black p-4 rounded-2xl border border-brand-border flex justify-between items-center">
                    <div>
                        <span class="font-black text-brand-orange">${o.id}</span> - <span class="text-sm font-bold">${o.customer}</span>
                        <p class="text-xs text-brand-grayText">Data: ${o.date} | ${o.items}</p>
                    </div>
                    <span class="text-lg font-black text-white">R$ ${o.total.toFixed(2)}</span>
                </div>
            `;
        });
    }
</script>
