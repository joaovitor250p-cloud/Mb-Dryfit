<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MB — Controle de Produção</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs (Modular v10 via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, query, orderBy, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 COLE AQUI AS SUAS CHAVES REAIS DO FIREBASE (DA TELA DO PRINT)
        const firebaseConfig = {
            apiKey: "AIzaSyB7xLVcP4o_vWKxqJ0A0GCHIifZgGDaYFY",
            authDomain: "mb-controle-producao.firebaseapp.com",
            projectId: "mb-controle-producao",
            storageBucket: "mb-controle-producao.firebasestorage.app",
            messagingSenderId: "257085823744",
            appId: "1:257085823744:web:51063883a3fd9eb03ff1e5",
            measurementId: "G-T25V4VJY5R"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.mbFirebase = { auth, db, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, query, orderBy, addDoc };
    </script>
    <!-- jsPDF & AutoTable via CDN for professional PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --warning: #ca8a04;
            --warning-light: #fefce8;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-600: #475569;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --sidebar-width: 260px;
            --topbar-height: 64px;
            --radius: 8px;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--gray-50);
            color: var(--gray-800);
            font-size: 14px;
            line-height: 1.5;
        }

        .hidden { display: none !important; }

        /* Login Screen */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 16px;
            width: 100%;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
        }
        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-logo {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            background: var(--primary);
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin: 0 auto 10px auto;
        }
        .login-header h1 { font-size: 18px; color: var(--gray-900); }
        .login-header p { color: var(--gray-600); font-size: 12px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 13px; color: var(--gray-800); }
        .input-icon { position: relative; width: 100%; }
        .input-icon i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
        .input-icon input, .form-group select, .form-group textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px 10px 38px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }
        .form-group select, .form-group textarea { padding-left: 12px; }
        .input-icon input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            min-height: 44px;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .error-message { color: var(--danger); font-size: 12px; margin-bottom: 10px; text-align: center; }

        /* App Layout & Sidebar Mobile-First */
        .app-container { display: flex; min-height: 100vh; width: 100%; position: relative; }
        
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }
        .sidebar-overlay.active { display: block; }

        .sidebar {
            width: var(--sidebar-width);
            background: #ffffff;
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-header {
            height: var(--topbar-height);
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--gray-200);
        }
        .brand-logo-small {
            background: var(--primary);
            color: white;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border-radius: 6px;
            font-size: 14px;
        }
        .brand-info h2 { font-size: 15px; color: var(--gray-900); }
        .brand-info span { font-size: 10px; color: var(--gray-600); }
        
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px; }
        .nav-section { margin-bottom: 16px; }
        .nav-section-title { font-size: 10px; text-transform: uppercase; color: var(--gray-400); font-weight: 600; margin-bottom: 6px; padding-left: 8px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
            padding: 10px 12px;
            color: var(--gray-600);
            text-decoration: none;
            border-radius: var(--radius);
            font-weight: 500;
            margin-bottom: 2px;
            transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: var(--primary-light); color: var(--primary); }
        
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-profile-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .user-avatar {
            width: 34px;
            height: 34px;
            background: var(--gray-200);
            color: var(--gray-800);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 11px;
            flex-shrink: 0;
        }
        .user-details { min-width: 0; }
        .user-details span { display: block; font-weight: 600; font-size: 12px; color: var(--gray-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-details small { font-size: 10px; color: var(--gray-500); }
        .btn-logout { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; padding: 10px; border-radius: 4px; flex-shrink: 0; min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; }
        .btn-logout:hover { background: var(--danger-light); }

        /* Main Content & Header Mobile-First */
        .main-content {
            width: 100%;
            max-width: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding-bottom: 30px;
        }
        
        .topbar {
            background: #ffffff;
            border-bottom: 1px solid var(--gray-200);
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 90;
            width: 100%;
        }
        .topbar-row-1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }
        .topbar-left-mob {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar-logo-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-900);
        }
        .topbar-right { display: flex; align-items: center; gap: 8px; }
        
        .global-search-container { position: relative; width: 100%; }
        .global-search-container i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
        .global-search-container input {
            width: 100%;
            min-height: 40px;
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            background: var(--gray-50);
            font-size: 13px;
            outline: none;
        }
        .global-search-container input:focus { background: #fff; border-color: var(--primary); }
        
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            margin-top: 4px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 110;
        }
        .search-result-item { padding: 12px 14px; border-bottom: 1px solid var(--gray-100); cursor: pointer; font-size: 13px; }
        .search-result-item:hover { background: var(--gray-50); }

        .icon-btn { position: relative; background: none; border: none; font-size: 18px; color: var(--gray-600); cursor: pointer; padding: 8px; border-radius: 50%; min-height: 40px; min-width: 40px; display: inline-flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: var(--gray-100); color: var(--gray-900); }
        
        .badge-counter {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 5px;
            border-radius: 10px;
        }
        
        .notifications-dropdown {
            position: absolute;
            right: 16px;
            top: 100%;
            width: calc(100vw - 32px);
            max-width: 320px;
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            z-index: 120;
        }
        .notif-header { padding: 12px 16px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .notif-header span { font-size: 11px; color: var(--primary); cursor: pointer; }
        .notif-item { padding: 12px 16px; border-bottom: 1px solid var(--gray-100); font-size: 13px; color: var(--gray-700); }
        .notif-item:last-child { border-bottom: none; }

        .page-content-area { padding: 16px; width: 100%; max-width: 100%; }

        /* UI Components Mobile First */
        .page-header { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 16px; gap: 10px; width: 100%; }
        .page-header h1 { font-size: 18px; color: var(--gray-900); font-weight: 700; }
        .page-subtitle { color: var(--gray-600); font-size: 12px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; width: 100%; }
        .stat-card { background: #fff; padding: 14px; border-radius: var(--radius); border: 1px solid var(--gray-200); box-shadow: var(--shadow); }
        .stat-card-title { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--gray-500); margin-bottom: 6px; }
        .stat-card-value { font-size: 20px; font-weight: 700; color: var(--gray-900); }

        .card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; box-shadow: var(--shadow); width: 100%; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
        .card-title { font-size: 15px; font-weight: 600; color: var(--gray-900); }

        /* Tables & Mobile Cards */
        .desktop-table-container { display: none; }
        .mobile-card-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        .data-table th { background: var(--gray-50); color: var(--gray-600); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--gray-200); white-space: nowrap; }
        .data-table td { padding: 12px 16px; border-bottom: 1px solid var(--gray-200); color: var(--gray-800); }
        .data-table tbody tr:hover { background: var(--gray-50); }

        .mobile-card-item { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .mobile-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray-100); padding-bottom: 8px; }
        .mobile-card-body { display: grid; grid-template-columns: 1fr; gap: 6px; font-size: 13px; }
        .mobile-card-body div span { color: var(--gray-500); display: inline-block; font-size: 11px; margin-right: 4px; }
        .mobile-card-footer { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--gray-100); padding-top: 8px; margin-top: 2px; flex-wrap: wrap; }

        /* Badges */
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block; text-align: center; }
        .badge-success { background: var(--success-light); color: var(--success); }
        .badge-warning { background: var(--warning-light); color: var(--warning); }
        .badge-danger { background: var(--danger-light); color: var(--danger); }
        .badge-info { background: var(--primary-light); color: var(--primary); }
        .badge-gray { background: var(--gray-100); color: var(--gray-600); }

        /* Modals */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 12px;
        }
        .modal-box {
            background: #fff;
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            max-height: 90vh;
            overflow-y: auto;
            padding: 16px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--gray-200); padding-bottom: 10px; }
        .modal-header h2 { font-size: 16px; color: var(--gray-900); }
        .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--gray-500); padding: 8px; min-height: 40px; min-width: 40px; display: flex; align-items: center; justify-content: center; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; border-top: 1px solid var(--gray-200); padding-top: 12px; flex-wrap: wrap; }

        /* Toasts */
        .toast-container { position: fixed; bottom: 16px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 32px); max-width: 350px; }
        .toast {
            background: var(--gray-900);
            color: #fff;
            padding: 12px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Print Media Query */
        @media print {
            body * { visibility: hidden; }
            #page-content, #page-content * { visibility: visible; }
            #page-content { position: absolute; left: 0; top: 0; width: 100%; padding: 0; }
            .topbar, .sidebar, .sidebar-overlay, .btn-primary, .icon-btn, .page-header button, .modal-backdrop { display: none !important; }
        }

        /* Desktop Media Query Enhancements */
        @media (min-width: 769px) {
            :root { --sidebar-width: 260px; }
            .sidebar { transform: translateX(0); }
            .sidebar-overlay { display: none !important; }
            .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); padding: 24px; }
            .topbar { flex-direction: row; justify-content: space-between; padding: 0 24px; height: var(--topbar-height); }
            .topbar-row-1 { width: auto; }
            .global-search-container { max-width: 400px; }
            .notifications-dropdown { right: 24px; width: 320px; }
            .page-header { flex-direction: row; justify-content: space-between; align-items: center; }
            .stats-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
            .desktop-table-container { display: block !important; }
            .mobile-card-list { display: none !important; }
            .modal-box { max-width: 950px; padding: 24px; }
            .toast-container { max-width: 400px; }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="brand-logo">MB</div>
                <h1>Controle de Produção</h1>
                <p>Faça login seguro no sistema</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">E-mail</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" required placeholder="seu.email@mb.com">
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Senha</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" required placeholder="••••••">
                    </div>
                </div>
                <div id="login-error" class="error-message hidden">E-mail ou senha inválidos.</div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-container" class="app-container hidden">
        <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
        
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo-small">MB</div>
                <div class="brand-info">
                    <h2>MB</h2>
                    <span>Controle de Produção</span>
                </div>
                <button id="sidebar-close" class="icon-btn" onclick="toggleSidebar()" style="margin-left:auto;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Preenchido via JS conforme perfil real do Firebase -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-info">
                    <div class="user-avatar" id="user-avatar-initials">US</div>
                    <div class="user-details">
                        <span id="sidebar-user-name">Usuário</span>
                        <small id="sidebar-user-role">PERFIL</small>
                    </div>
                </div>
                <button onclick="logout()" class="btn-logout" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </aside>

        <!-- Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-row-1">
                    <div class="topbar-left-mob">
                        <button id="sidebar-toggle" class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                        <div class="topbar-logo-text">MB</div>
                    </div>
                    <div class="topbar-right">
                        <div class="notifications-container" style="position:relative;">
                            <button class="icon-btn" onclick="toggleNotifications()">
                                <i class="fa-solid fa-bell"></i>
                                <span class="badge-counter" id="notif-count">3</span>
                            </button>
                            <div id="notifications-dropdown" class="notifications-dropdown hidden">
                                <div class="notif-header">
                                    <h3>Notificações</h3>
                                    <span onclick="clearNotifications()">Marcar lidas</span>
                                </div>
                                <div class="notif-list" id="notif-list">
                                    <div class="notif-item">✂️ Cortes prontos aguardando envio.</div>
                                    <div class="notif-item">🏭 OCs em produção nas oficinas.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="global-search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="global-search" placeholder="🔎 Buscar OC, referência ou oficina..." oninput="handleGlobalSearch(this.value)">
                    <div id="search-results-dropdown" class="search-dropdown hidden"></div>
                </div>
            </header>

            <div id="page-content" class="page-content-area"></div>
        </main>
    </div>

    <!-- Modals & Toasts -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
        <div id="modal-container" class="modal-box"></div>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Memória local do aplicativo sincronizada com Firestore
        let DB = {
            workshops: [
                { name: "Francisca", phone: "(11) 99999-9999", address: "SP", status: "Ativa" },
                { name: "Virgilio", phone: "(11) 98888-8888", address: "SP", status: "Ativa" },
                { name: "Dario Medina", phone: "(19) 97777-7777", address: "SP", status: "Ativa" },
                { name: "Rodrigo", phone: "(11) 96666-6666", address: "SP", status: "Ativa" },
                { name: "Samuel", phone: "(11) 95555-5555", address: "SP", status: "Ativa" },
                { name: "Mauro", phone: "(11) 94444-4444", address: "SP", status: "Ativa" },
                { name: "Ramiro", phone: "(11) 93333-3333", address: "SP", status: "Ativa" },
                { name: "Victor", phone: "(11) 92222-2222", address: "SP", status: "Ativa" },
                { name: "Jhony", phone: "(11) 91111-1111", address: "SP", status: "Ativa" }
            ],
            references: [
                { code: "1036", name: "Regata com Recorte Lateral", product: "Regata", fabric: "Malha", status: "Ativa" }
            ],
            products: [
                { name: "Regata", description: "Regatas esportivas", status: "Ativo" },
                { name: "Conjunto", description: "Conjuntos completos", status: "Ativo" },
                { name: "Bermuda", description: "Bermudas casuais", status: "Ativo" },
                { name: "Camisa", description: "Camisas", status: "Ativo" }
            ],
            fabrics: [{ name: "Malha" }, { name: "Dry Fit" }, { name: "Moletinho" }],
            cuts: [],
            shipments: [],
            production_orders: [],
            audit_logs: []
        };

        let currentUser = null;

        function formatNumber(num) { return num ? num.toLocaleString('pt-BR') : '0'; }
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
        }
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
        }
        function openModal(html) {
            document.getElementById('modal-container').innerHTML = html;
            document.getElementById('modal-backdrop').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modal-backdrop').classList.add('hidden'); }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // Real Firebase Auth Handler
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            if (window.mbFirebase) {
                try {
                    const { auth, db, signInWithEmailAndPassword, collection, getDocs } = window.mbFirebase;
                    const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                    const user = userCredential.user;

                    // Buscar perfil na collection 'profiles' do Firestore
                    const querySnapshot = await getDocs(collection(db, "profiles"));
                    let userProfile = null;
                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        if (data.email === email || docSnap.id === user.uid) {
                            userProfile = { id: user.uid, ...data };
                        }
                    });

                    if (!userProfile) {
                        // Fallback se perfil não foi criado no Firestore ainda
                        if (email.includes('admin')) userProfile = { id: user.uid, name: 'Marcos', role: 'ADMIN', email };
                        else if (email.includes('transporte')) userProfile = { id: user.uid, name: 'Jéssica', role: 'TRANSPORTE', email };
                        else userProfile = { id: user.uid, name: 'Nildo', role: 'CORTE', email };
                    }

                    currentUser = userProfile;
                    localStorage.setItem('mb_current_user', JSON.stringify(currentUser));
                    await loadFirestoreData();
                    initApp();
                } catch (err) {
                    console.error(err);
                    document.getElementById('login-error').classList.remove('hidden');
                }
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        async function logout() {
            if (window.mbFirebase) {
                await window.mbFirebase.signOut(window.mbFirebase.auth);
            }
            currentUser = null;
            localStorage.removeItem('mb_current_user');
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        async function loadFirestoreData() {
            if (!window.mbFirebase) return;
            try {
                const { db, collection, getDocs } = window.mbFirebase;
                const cutsSnap = await getDocs(collection(db, "cuts"));
                DB.cuts = [];
                cutsSnap.forEach(d => DB.cuts.push(d.data()));

                const ordersSnap = await getDocs(collection(db, "productionOrders"));
                DB.production_orders = [];
                ordersSnap.forEach(d => DB.production_orders.push(d.data()));

                const logsSnap = await getDocs(collection(db, "auditLogs"));
                DB.audit_logs = [];
                logsSnap.forEach(d => DB.audit_logs.push(d.data()));
            } catch (e) {
                console.error("Erro ao carregar Firestore:", e);
            }
        }

        function initApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('sidebar-user-name').innerText = currentUser.name;
            document.getElementById('sidebar-user-role').innerText = currentUser.role;
            document.getElementById('user-avatar-initials').innerText = currentUser.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
            buildSidebarNav();
            navigateTo('dashboard');
        }

        function buildSidebarNav() {
            const nav = document.getElementById('sidebar-nav');
            let html = '';
            if (currentUser.role === 'ADMIN') {
                html = `
                    <div class="nav-section"><a href="#" class="nav-item active" onclick="navigateTo('dashboard', this)"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></div>
                    <div class="nav-section">
                        <div class="nav-section-title">Produção</div>
                        <a href="#" class="nav-item" onclick="navigateTo('cuts', this)"><i class="fa-solid fa-scissors"></i> Cortes & Rascunhos</a>
                        <a href="#" class="nav-item" onclick="navigateTo('transport', this)"><i class="fa-solid fa-truck-fast"></i> Transporte</a>
                        <a href="#" class="nav-item" onclick="navigateTo('orders', this)"><i class="fa-solid fa-file-invoice"></i> OCs</a>
                    </div>
                    <div class="nav-section">
                        <div class="nav-section-title">Cadastros</div>
                        <a href="#" class="nav-item" onclick="navigateTo('workshops', this)"><i class="fa-solid fa-building"></i> Oficinas</a>
                        <a href="#" class="nav-item" onclick="navigateTo('references', this)"><i class="fa-solid fa-tag"></i> Referências</a>
                        <a href="#" class="nav-item" onclick="navigateTo('products', this)"><i class="fa-solid fa-shirt"></i> Produtos</a>
                    </div>
                    <div class="nav-section">
                        <div class="nav-section-title">Gestão</div>
                        <a href="#" class="nav-item" onclick="navigateTo('reports', this)"><i class="fa-solid fa-chart-line"></i> Relatórios</a>
                        <a href="#" class="nav-item" onclick="navigateTo('history', this)"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
                    </div>
                `;
            } else if (currentUser.role === 'TRANSPORTE') {
                html = `
                    <div class="nav-section"><a href="#" class="nav-item active" onclick="navigateTo('dashboard', this)"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></div>
                    <div class="nav-section">
                        <div class="nav-section-title">Operacional</div>
                        <a href="#" class="nav-item" onclick="navigateTo('transport', this)"><i class="fa-solid fa-truck-fast"></i> Transporte</a>
                        <a href="#" class="nav-item" onclick="navigateTo('orders', this)"><i class="fa-solid fa-file-invoice"></i> Acabamento e OCs</a>
                        <a href="#" class="nav-item" onclick="navigateTo('workshops', this)"><i class="fa-solid fa-building"></i> Oficinas</a>
                        <a href="#" class="nav-item" onclick="navigateTo('history', this)"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
                    </div>
                `;
            } else if (currentUser.role === 'CORTE') {
                html = `
                    <div class="nav-section"><a href="#" class="nav-item active" onclick="navigateTo('dashboard', this)"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></div>
                    <div class="nav-section">
                        <div class="nav-section-title">Cortes</div>
                        <a href="#" class="nav-item" onclick="navigateTo('cuts', this)"><i class="fa-solid fa-scissors"></i> Cortes & Rascunhos</a>
                        <a href="#" class="nav-item" onclick="openNewCutModal()"><i class="fa-solid fa-plus"></i> Novo Corte</a>
                        <a href="#" class="nav-item" onclick="navigateTo('history', this)"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
                    </div>
                `;
            }
            nav.innerHTML = html;
        }

        function navigateTo(page, el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            if(window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }
            const content = document.getElementById('page-content');
            if (page === 'dashboard') renderDashboard(content);
            else if (page === 'cuts') renderCuts(content);
            else if (page === 'transport') renderTransport(content);
            else if (page === 'orders') renderOrders(content);
            else if (page === 'workshops') renderWorkshops(content);
            else if (page === 'references') renderReferences(content);
            else if (page === 'products') renderProducts(content);
            else if (page === 'reports') renderReports(content);
            else if (page === 'history') renderHistory(content);
        }

        function renderDashboard(container) {
            const rascunhosCount = DB.cuts.filter(c => c.status === '📝 Rascunho').length;
            const cutsReady = DB.cuts.filter(c => c.status === '✂️ Corte pronto').length;
            const ocsInProc = DB.production_orders.filter(o => o.status === '🏭 Na oficina').length;
            const ocsFinishing = DB.production_orders.filter(o => o.status === '🎨 Corte no acabamento').length;

            if (currentUser.role === 'ADMIN') {
                container.innerHTML = `
                    <div class="page-header">
                        <div><h1>Bom dia, ${currentUser.name}</h1><span class="page-subtitle">Indicadores de fluxo da produção (${currentUser.name} - ${currentUser.role})</span></div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-card-title">📝 Rascunhos</div><div class="stat-card-value">${rascunhosCount}</div></div>
                        <div class="stat-card"><div class="stat-card-title">✂️ Cortes Prontos</div><div class="stat-card-value">${cutsReady}</div></div>
                        <div class="stat-card"><div class="stat-card-title">🏭 Em Oficina</div><div class="stat-card-value">${ocsInProc}</div></div>
                        <div class="stat-card"><div class="stat-card-title">🎨 No Acabamento</div><div class="stat-card-value">${ocsFinishing}</div></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Atividade Recente</h3></div>
                        <div class="desktop-table-container table-responsive">
                            <table class="data-table">
                                <thead><tr><th>DATA</th><th>HORA</th><th>USUÁRIO</th><th>AÇÃO</th><th>ALVO</th><th>DETALHES</th></tr></thead>
                                <tbody>
                                    ${DB.audit_logs.map(l => `<tr><td>${l.date}</td><td>${l.time}</td><td>${l.user}</td><td><span class="badge badge-info">${l.action}</span></td><td><strong>${l.target}</strong></td><td>${l.details}</td></tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else if (currentUser.role === 'TRANSPORTE') {
                const readyCuts = DB.cuts.filter(c => c.status === '✂️ Corte pronto');
                const totalPiecesReady = readyCuts.reduce((a,c) => a + c.pending, 0);
                container.innerHTML = `
                    <div class="page-header"><div><h1>Painel de Transporte</h1><span class="page-subtitle">${currentUser.name} (${currentUser.role}) — Expedição e Acompanhamento de OCs</span></div></div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-card-title">Cortes Prontos</div><div class="stat-card-value">${readyCuts.length}</div></div>
                        <div class="stat-card"><div class="stat-card-title">Peças para Enviar</div><div class="stat-card-value">${formatNumber(totalPiecesReady)}</div></div>
                    </div>
                    <div class="card" style="display:flex; gap:10px; flex-wrap:wrap;">
                        <button class="btn-primary" onclick="navigateTo('transport')">Ver Cortes Prontos para Envio</button>
                        <button class="btn-primary" style="background:var(--success);" onclick="navigateTo('orders')">Acabamento e Produção</button>
                    </div>
                `;
            } else if (currentUser.role === 'CORTE') {
                const myDrafts = DB.cuts.filter(c => c.status === '📝 Rascunho').length;
                const myReady = DB.cuts.filter(c => c.status === '✂️ Corte pronto').length;
                container.innerHTML = `
                    <div class="page-header"><div><h1>Painel de Corte</h1><span class="page-subtitle">${currentUser.name} (${currentUser.role}) — Rascunhos e Lotes Prontos</span></div></div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-card-title">Meus Rascunhos</div><div class="stat-card-value">${myDrafts}</div></div>
                        <div class="stat-card"><div class="stat-card-title">Cortes Prontos</div><div class="stat-card-value">${myReady}</div></div>
                    </div>
                    <div class="card"><button class="btn-primary" onclick="openNewCutModal()"><i class="fa-solid fa-plus"></i> Novo Corte (Rascunho)</button></div>
                `;
            }
        }

        function renderCuts(container) {
            const myDrafts = DB.cuts.filter(c => c.status === '📝 Rascunho');
            const otherCuts = DB.cuts.filter(c => c.status !== '📝 Rascunho');

            container.innerHTML = `
                <div class="page-header">
                    <div><h1>Cortes & Rascunhos</h1><span class="page-subtitle">Gerenciamento de fichas de corte</span></div>
                    ${currentUser.role !== 'TRANSPORTE' ? `<button class="btn-primary" onclick="openNewCutModal()"><i class="fa-solid fa-plus"></i> Novo Corte</button>` : ''}
                </div>
                ${currentUser.role === 'CORTE' || currentUser.role === 'ADMIN' ? `
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">📝 Meus Rascunhos</h3></div>
                        <div class="desktop-table-container table-responsive">
                            <table class="data-table">
                                <thead><tr><th>OC</th><th>REFERÊNCIA</th><th>PRODUTO</th><th>TOTAL DE PEÇAS</th><th>STATUS</th><th>AÇÕES</th></tr></thead>
                                <tbody>
                                    ${myDrafts.length === 0 ? `<tr><td colspan="6" style="text-align:center; color:var(--gray-500); padding:16px;">Nenhum rascunho no momento.</td></tr>` : myDrafts.map(c => `
                                        <tr>
                                            <td><strong>OC ${c.oc}</strong></td>
                                            <td>${c.reference}</td>
                                            <td>${c.product}</td>
                                            <td>${formatNumber(c.total)}</td>
                                            <td><span class="badge badge-warning">${c.status}</span></td>
                                            <td>
                                                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                                                    <button class="btn-primary" style="padding:4px 8px; font-size:11px; min-height:30px; background:var(--warning); width:auto;" onclick="openEditCutModal('${c.number}')">Editar</button>
                                                    <button class="btn-primary" style="padding:4px 8px; font-size:11px; min-height:30px; background:var(--danger); width:auto;" onclick="confirmDeleteDraft('${c.number}')">Excluir</button>
                                                    <button class="btn-primary" style="padding:4px 8px; font-size:11px; min-height:30px; width:auto;" onclick="confirmMarkReady('${c.number}')">Corte Pronto</button>
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                ` : ''}

                <div class="card">
                    <div class="card-header"><h3 class="card-title">Cortes Finalizados / Em Andamento</h3></div>
                    <div class="desktop-table-container table-responsive">
                        <table class="data-table">
                            <thead><tr><th>OC</th><th>DATA</th><th>REFERÊNCIA</th><th>PRODUTO</th><th>TOTAL DE PEÇAS</th><th>SITUAÇÃO</th><th>AÇÕES</th></tr></thead>
                            <tbody>
                                ${otherCuts.length === 0 ? `<tr><td colspan="7" style="text-align:center; color:var(--gray-500); padding:16px;">Nenhum corte finalizado.</td></tr>` : otherCuts.map(c => `
                                    <tr>
                                        <td><strong>OC ${c.oc}</strong></td>
                                        <td>${formatDate(c.date)}</td>
                                        <td>${c.reference}</td>
                                        <td>${c.product}</td>
                                        <td>${formatNumber(c.total)}</td>
                                        <td><span class="badge badge-success">${c.status}</span></td>
                                        <td>
                                            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                                                ${currentUser.role === 'ADMIN' ? `<button class="btn-primary" style="background:var(--warning); padding:4px 8px; font-size:11px; min-height:30px; width:auto;" onclick="confirmDevolucao('${c.oc}')">Devolver</button>` : ''}
                                                <button class="btn-primary" style="background:var(--success); padding:4px 8px; font-size:11px; min-height:30px; width:auto;" onclick="downloadOCPDF('${c.oc}')">Baixar OC</button>
                                                <button class="icon-btn" onclick="showCutDetails('${c.number}')"><i class="fa-solid fa-eye"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        let dynamicColors = [{ color: "", p: 0, m: 0, g: 0, gg: 0, xg: 0, details: "", total: 0 }];
        let editingCutNumber = null;

        function openNewCutModal() {
            editingCutNumber = null;
            dynamicColors = [{ color: "", p: 0, m: 0, g: 0, gg: 0, xg: 0, details: "", total: 0 }];
            renderCutFormModal("Novo Corte (Rascunho)", "");
        }

        function openEditCutModal(num) {
            const c = DB.cuts.find(x => x.number === num);
            if (!c || c.status !== '📝 Rascunho') return;
            editingCutNumber = c.number;
            dynamicColors = JSON.parse(JSON.stringify(c.colors || [{ color: "", p: 0, m: 0, g: 0, gg: 0, xg: 0, details: "", total: 0 }]));
            renderCutFormModal("Editar Rascunho", c.oc, c.reference, c.product, c.obs, c.volumes);
        }

        function renderCutFormModal(title, ocVal = "", refVal = "", prodVal = "", obsVal = "", volVal = 1) {
            openModal(`
                <div class="modal-header"><h2>${title}</h2><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
                <form onsubmit="handleSaveCut(event)">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div class="form-group"><label>Número da OC</label><input type="text" id="cut-oc" required value="${ocVal}" placeholder="Ex: 434"></div>
                        <div class="form-group"><label>Referência</label><input type="text" id="cut-ref" required value="${refVal}" placeholder="Ex: 1036"></div>
                    </div>
                    <div class="form-group">
                        <label>Modelo / Produto</label>
                        <select id="cut-prod">${DB.products.map(p=>`<option value="${p.name}" ${prodVal === p.name ? 'selected' : ''}>${p.name}</option>`).join('')}</select>
                    </div>
                    <div class="form-group"><label>Informações / Observações</label><textarea id="cut-obs" placeholder="Observações e instruções">${obsVal}</textarea></div>
                    <hr style="margin:16px 0; border:0; border-top:1px solid var(--gray-200);">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <strong style="font-size:13px; text-transform:uppercase;">Cores e Grade por Tamanho</strong>
                        <button type="button" class="btn-primary" style="width:auto; padding:6px 12px; font-size:12px;" onclick="addColorRow()">+ Adicionar cor</button>
                    </div>
                    <div id="colors-container" style="display:flex; flex-direction:column; gap:10px; margin-bottom:12px;"></div>
                    <div style="background:var(--gray-50); padding:12px; border-radius:var(--radius); border:1px solid var(--gray-200); margin-bottom:14px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <label style="font-size:12px; font-weight:600;">Volumes:</label>
                                <input type="number" id="cut-volumes" value="${volVal}" min="1" required style="width:90px; display:inline-block; margin-left:8px; font-weight:600; text-align:center;">
                            </div>
                            <div style="text-align:right;">
                                <span style="font-size:11px; color:var(--gray-600); text-transform:uppercase; display:block;">Total Geral</span>
                                <strong id="modal-total-geral" style="font-size:18px; color:var(--primary);">0 PEÇAS</strong>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-primary" style="background:var(--warning); width:auto;" onclick="saveCutAsDraft()">💾 Salvar Rascunho</button>
                        <button type="submit" class="btn-primary" style="width:auto;">✓ Corte Pronto</button>
                    </div>
                </form>
            `);
            renderColorRows();
        }

        function renderColorRows() {
            const container = document.getElementById('colors-container');
            container.innerHTML = dynamicColors.map((item, idx) => `
                <div style="background:var(--gray-50); border:1px solid var(--gray-200); padding:10px; border-radius:var(--radius); display:flex; flex-direction:column; gap:8px;">
                    <div style="display:flex; gap:8px; align-items:center;">
                        <input type="text" placeholder="Nome da Cor" value="${item.color}" id="color-name-${idx}" oninput="updateColorFieldInput(${idx}, 'color', this)" required style="flex:2; min-height:38px;">
                        <input type="text" placeholder="Detalhes" value="${item.details}" id="color-details-${idx}" oninput="updateColorFieldInput(${idx}, 'details', this)" style="flex:2; min-height:38px;">
                        ${dynamicColors.length > 1 ? `<button type="button" onclick="removeColorRow(${idx})" style="background:var(--danger); color:#fff; border:none; padding:8px 12px; border-radius:4px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                    <div style="display:grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap:4px;">
                        <div><small style="font-size:10px;">P</small><input type="text" inputmode="numeric" value="${item.p || ''}" id="c-${idx}-p" oninput="updateColorQty(${idx}, 'p', this)" style="text-align:center; min-height:38px; padding:2px; font-size:14px; font-weight:600; width:100%;"></div>

        function updateColorFieldInput(idx, field, el) {
            dynamicColors[idx][field] = el.value;
        }

        function updateColorQty(idx, field, el) {
            const val = el.value;
            const num = val === "" ? 0 : parseInt(val);
            dynamicColors[idx][field] = isNaN(num) || num < 0 ? 0 : num;
            const c = dynamicColors[idx];
            c.total = (c.p || 0) + (c.m || 0) + (c.g || 0) + (c.gg || 0) + (c.xg || 0);
            
            const totalEl = document.getElementById(`c-${idx}-total`);
            if(totalEl) totalEl.innerText = c.total;

        async function executeSaveShipment(cutNum, qty, volumesVal, workshop) {
            const c = DB.cuts.find(x => x.number === cutNum);
            c.sent += qty;
            c.pending -= qty;
            c.status = c.pending === 0 ? "🚚 Enviado para oficina" : "🚚 Envio parcial";

            const shipData = { cut_number: c.number, oc: c.oc, workshop, quantity: qty, volumes: volumesVal, date: new Date().toISOString().split('T')[0], responsible: currentUser.name, observation: '' };
            
            let existingOC = DB.production_orders.find(o => o.number === c.oc);
            let ocData = null;
            if (existingOC) {
                existingOC.total += qty;
                existingOC.pending += qty;
                existingOC.volumes = (existingOC.volumes || 0) + volumesVal;
                existingOC.workshop = workshop;
                ocData = existingOC;
            } else {
                ocData = {
                    number: c.oc,
                    date: c.date,
                    reference: c.reference,
                    product: c.product,
                    fabric: c.fabric,
                    workshop: workshop,
                    colors: JSON.parse(JSON.stringify(c.colors || [])),
                    volumes: volumesVal,
                    total: qty, produced: 0, pending: qty,
                    status: "🏭 Na oficina",
                    obs: c.obs
                };
                DB.production_orders.unshift(ocData);
            }

            const logData = {
                date: new Date().toLocaleDateString('pt-BR'),
                time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}),
                user_name: currentUser.name,
                action: "Em processo na oficina",
                target: `OC ${c.oc}`,
                details: `${currentUser.name} enviou ${qty} peças (${volumesVal} volumes) do corte ${c.number} para Oficina: ${workshop} (Status: 🏭 Em processo na oficina).`
            };

            if (supabaseClient) {
                await supabaseClient.from('cuts').update({ sent: c.sent, pending: c.pending, status: c.status }).eq('number', c.number);
                await supabaseClient.from('shipments').insert([shipData]);
                await supabaseClient.from('production_orders').upsert(ocData, { onConflict: 'number' });
                await supabaseClient.from('audit_logs').insert([logData]);
                await loadCloudData();
            } else {
                DB.audit_logs.unshift({ id: Date.now(), date: logData.date, time: logData.time, user: logData.user_name, action: logData.action, target: logData.target, details: logData.details });
                saveDB();
            }

            closeModal();
            showToast('✓ Envio registrado com sucesso.');
            renderTransport(document.getElementById('page-content'));
        }

        function downloadOCPDF(num) {
            let o = DB.production_orders.find(x => x.number === num);
            if (!o) {
                const c = DB.cuts.find(x => x.oc === num);
                if (c) {
                    o = { number: c.oc, reference: c.reference, product: c.product, fabric: c.fabric, workshop: "Não definida", colors: c.colors, volumes: c.volumes, total: c.total, obs: c.obs, status: c.status };
                }
            }

            if (!o) {
                showToast(`OC ${num} não encontrada para exportação.`, 'error');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

            doc.setFont('inter', 'bold');
            doc.setFontSize(16);
            doc.setTextColor(15, 23, 42);
            doc.text('MB — FICHA DE PRODUÇÃO', 14, 16);

            doc.setDrawColor(100, 116, 139);
            doc.setLineWidth(0.3);
            doc.rect(14, 20, 182, 18);
            doc.line(14, 29, 196, 29);
            doc.line(130, 20, 130, 38);

            doc.setFontSize(9);
            doc.setFont('inter', 'bold');
            doc.text('Modelo:', 16, 25);
            doc.setFont('inter', 'normal');
            doc.text(`${o.product || '-'}`, 35, 25);

            doc.setFont('inter', 'bold');
            doc.text('REF:', 132, 25);
            doc.setFont('inter', 'normal');
            doc.text(`${o.reference || '-'}`, 145, 25);

            doc.setFont('inter', 'bold');
            doc.text('OC:', 132, 34);
            doc.setFont('inter', 'normal');
            doc.text(`${o.number}`, 145, 34);

            doc.rect(14, 38, 182, 14);
            doc.setFont('inter', 'bold');
            doc.text('Oficina:', 16, 46);
            doc.setFont('inter', 'normal');
            doc.text(`${o.workshop || 'Não definida'}`, 32, 46);

            let tableBody = [];
            let sumP = 0, sumM = 0, sumG = 0, sumGG = 0, sumXG = 0, totalGeral = 0;

            if (o.colors && o.colors.length > 0) {
                o.colors.forEach(col => {
                    tableBody.push([
                        col.color || 'Padrão',
                        col.p || 0,
                        col.m || 0,
                        col.g || 0,
                        col.gg || 0,
                        col.xg || 0,
                        col.details || '',
                        col.total || 0
                    ]);
                    sumP += (col.p || 0);
                    sumM += (col.m || 0);
                    sumG += (col.g || 0);
                    sumGG += (col.gg || 0);
                    sumXG += (col.xg || 0);
                    totalGeral += (col.total || 0);
                });
            } else {
                tableBody.push(['Padrão', o.p || 0, o.m || 0, o.g || 0, o.gg || 0, 0, '', o.total || 0]);
                sumP += (o.p || 0); sumM += (o.m || 0); sumG += (o.g || 0); sumGG += (o.gg || 0);
                totalGeral += (o.total || 0);
            }

            tableBody.push(['TOTAL', sumP, sumM, sumG, sumGG, sumXG, '', totalGeral]);

            doc.autoTable({
                startY: 56,
                head: [['CORES', 'P', 'M', 'G', 'GG', 'XG', 'DETALHES']],
                body: tableBody.map(row => [row[0], row[1], row[2], row[3], row[4], row[5], row[6]]),
                theme: 'grid',
                headStyles: { fillColor: [255, 255, 255], textColor: [15, 23, 42], fontStyle: 'bold', fontSize: 9, lineWidth: 0.3, lineColor: [100, 116, 139], halign: 'center' },
                bodyStyles: { fontSize: 9, textColor: [30, 41, 59], lineWidth: 0.3, lineColor: [100, 116, 139] },
                columnStyles: {
                    0: { cellWidth: 45, fontStyle: 'bold' },
                    1: { cellWidth: 18, halign: 'center' },
                    2: { cellWidth: 18, halign: 'center' },
                    3: { cellWidth: 18, halign: 'center' },
                    4: { cellWidth: 18, halign: 'center' },
                    5: { cellWidth: 18, halign: 'center' },
                    6: { cellWidth: 57 }
                },
                didParseCell: function (data) {
                    if (data.row.index === tableBody.length - 1) {
                        data.cell.styles.fontStyle = 'bold';
                        data.cell.styles.fillColor = [241, 245, 249];
                    }
                }
            });

            const finalY = doc.lastAutoTable.finalY + 6;

            doc.setDrawColor(100, 116, 139);
            doc.rect(14, finalY, 182, 28);
            doc.setFont('inter', 'bold');
            doc.setFontSize(9);
            doc.text('Outras inf:', 16, finalY + 6);
            doc.setFont('inter', 'normal');
            const splitObs = doc.splitTextToSize(o.obs || 'Nenhuma observação', 170);
            doc.text(splitObs, 16, finalY + 12);

            doc.rect(14, finalY + 28, 50, 14);
            doc.setFont('inter', 'bold');
            doc.text(`Volumes: ${o.volumes || 1}`, 18, finalY + 37);

            doc.rect(64, finalY + 28, 132, 14);
            doc.text(`TOTAL GERAL DE PEÇAS: ${totalGeral}`, 70, finalY + 37);

            doc.save(`OC-${o.number}.pdf`);
            showToast(`✓ Download do PDF da OC ${o.number} realizado com sucesso.`);
        }

        function showOrderDetails(num) {
            let o = DB.production_orders.find(x => x.number === num);
            if (!o) {
                const c = DB.cuts.find(x => x.oc === num);
                if (c) {
                    o = { number: c.oc, reference: c.reference, product: c.product, fabric: c.fabric, workshop: "Não definida", colors: c.colors, volumes: c.volumes, total: c.total, obs: c.obs, status: c.status };
                }
            }
            if (!o) return;

            let colorsTableHTML = '';
            let sumP = 0, sumM = 0, sumG = 0, sumGG = 0, sumXG = 0, totalGeral = 0;

            if (o.colors && o.colors.length > 0) {
                colorsTableHTML = `
                    <div style="margin-bottom:12px; overflow-x:auto;">
                        <table style="width:100%; border-collapse:collapse; font-size:12px; text-align:center;">
                            <thead>
                                <tr style="background:var(--gray-100); border-bottom:1px solid var(--gray-300);">
                                    <th style="padding:6px; text-align:left;">Cor</th>
                                    <th style="padding:6px;">P</th>
                                    <th style="padding:6px;">M</th>
                                    <th style="padding:6px;">G</th>
                                    <th style="padding:6px;">GG</th>
                                    <th style="padding:6px;">XG</th>
                                    <th style="padding:6px; text-align:left;">Detalhes</th>
                                    <th style="padding:6px;">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${o.colors.map(col => {
                                    sumP += (col.p || 0); sumM += (col.m || 0); sumG += (col.g || 0); sumGG += (col.gg || 0); sumXG += (col.xg || 0); totalGeral += (col.total || 0);
                                    return `
                                        <tr style="border-bottom:1px solid var(--gray-200);">
                                            <td style="padding:6px; text-align:left; font-weight:600;">${col.color}</td>
                                            <td style="padding:6px;">${col.p}</td>
                                            <td style="padding:6px;">${col.m}</td>
                                            <td style="padding:6px;">${col.g}</td>
                                            <td style="padding:6px;">${col.gg}</td>
                                            <td style="padding:6px;">${col.xg || 0}</td>
                                            <td style="padding:6px; text-align:left; color:var(--gray-600);">${col.details || '-'}</td>
                                            <td style="padding:6px; font-weight:600;">${col.total}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                            <tfoot>
                                <tr style="background:var(--gray-100); font-weight:600;">
                                    <td style="padding:6px; text-align:left;">TOTAL</td>
                                    <td style="padding:6px;">${sumP}</td>
                                    <td style="padding:6px;">${sumM}</td>
                                    <td style="padding:6px;">${sumG}</td>
                                    <td style="padding:6px;">${sumGG}</td>
                                    <td style="padding:6px;">${sumXG}</td>
                                    <td style="padding:6px;"></td>
                                    <td style="padding:6px;">${totalGeral}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;
            }

            openModal(`
                <div class="modal-header">
                    <h2>Ficha da OC ${o.number}</h2>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button class="btn-primary" style="background:var(--success); padding:6px 12px; font-size:12px; width:auto;" onclick="downloadOCPDF('${o.number}')">⬇ Baixar OC</button>
                        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <div style="font-size:13px; display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
                    <div>🏭 <strong>Oficina:</strong> ${o.workshop || 'Não definida'}</div>
                    <div>👕 <strong>Modelo/Produto:</strong> ${o.product} | 🔢 <strong>Ref:</strong> ${o.reference}</div>
                </div>
                ${colorsTableHTML}
                <div style="background:var(--gray-50); padding:8px; border-radius:var(--radius); margin-bottom:12px; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
                    <div><strong>Outras inf / Observações:</strong> ${o.obs || 'Nenhuma'}</div>
                    <div><strong>Volumes:</strong> ${o.volumes || 1}</div>
                </div>
                <div class="modal-footer"><button class="btn-primary" onclick="closeModal()">Fechar</button></div>
            `);
        }

        function renderWorkshops(container) {
            container.innerHTML = `
                <div class="page-header">
                    <div><h1>Oficinas Independentes</h1><span class="page-subtitle">Parceiros cadastrados</span></div>
                </div>
                <div class="card">
                    <div class="desktop-table-container table-responsive">
                        <table class="data-table">
                            <thead><tr><th>OFICINA</th><th>STATUS</th></tr></thead>
                            <tbody>
                                ${DB.workshops.map(w => `
                                    <tr>
                                        <td><strong>Oficina: ${w.name}</strong></td>
                                        <td><span class="badge badge-success">${w.status}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderReferences(container) {
            container.innerHTML = `<div class="page-header"><div><h1>Referências</h1><span class="page-subtitle">Modelos cadastrados</span></div></div><div class="card"><div class="desktop-table-container table-responsive"><table class="data-table"><thead><tr><th>CÓDIGO</th><th>NOME</th><th>PRODUTO</th><th>TECIDO PADRÃO</th></tr></thead><tbody>${DB.references.map(r=>`<tr><td><strong>${r.code}</strong></td><td>${r.name}</td><td>${r.product}</td><td>${r.fabric}</td></tr>`).join('')}</tbody></table></div></div>`;
        }
        function renderProducts(container) {
            container.innerHTML = `<div class="page-header"><div><h1>Produtos</h1><span class="page-subtitle">Tipos de vestuário</span></div></div><div class="card"><div class="desktop-table-container table-responsive"><table class="data-table"><thead><tr><th>NOME</th><th>DESCRIÇÃO</th></tr></thead><tbody>${DB.products.map(p=>`<tr><td><strong>${p.name}</strong></td><td>${p.description}</td></tr>`).join('')}</tbody></table></div></div>`;
        }
        function renderReports(container) {
            const totalPiecesCut = DB.cuts.reduce((a,c) => a + c.total, 0);
            const totalPiecesSent = DB.shipments.reduce((a,s) => a + s.quantity, 0);
            const totalProduced = DB.production_orders.reduce((a,o) => a + o.produced, 0);
            
            const totalP = DB.production_orders.reduce((a,o) => a + (o.colors ? o.colors.reduce((ac,cc)=>ac+(cc.p||0),0) : 0), 0);
            const totalM = DB.production_orders.reduce((a,o) => a + (o.colors ? o.colors.reduce((ac,cc)=>ac+(cc.m||0),0) : 0), 0);
            const totalG = DB.production_orders.reduce((a,o) => a + (o.colors ? o.colors.reduce((ac,cc)=>ac+(cc.g||0),0) : 0), 0);
            const totalGG = DB.production_orders.reduce((a,o) => a + (o.colors ? o.colors.reduce((ac,cc)=>ac+(cc.gg||0),0) : 0), 0);
            const totalXG = DB.production_orders.reduce((a,o) => a + (o.colors ? o.colors.reduce((ac,cc)=>ac+(cc.xg||0),0) : 0), 0);

            let refMap = {};
            DB.production_orders.forEach(o => {
                if(!refMap[o.reference]) refMap[o.reference] = { count: 0, total: 0 };
                refMap[o.reference].count += 1;
                refMap[o.reference].total += o.total;
            });

            container.innerHTML = `
                <div class="page-header">
                    <div><h1>Relatórios de Setembro/2026</h1><span class="page-subtitle">${currentUser.name} — Consolidado e status da produção</span></div>
                    <button class="btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Imprimir</button>
                </div>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-card-title">Total de OCs</div><div class="stat-card-value">${DB.production_orders.length}</div></div>
                    <div class="stat-card"><div class="stat-card-title">Peças Cortadas</div><div class="stat-card-value">${formatNumber(totalPiecesCut)}</div></div>
                    <div class="stat-card"><div class="stat-card-title">Enviadas Oficina</div><div class="stat-card-value">${formatNumber(totalPiecesSent)}</div></div>
                    <div class="stat-card"><div class="stat-card-title">Peças Produzidas</div><div class="stat-card-value">${formatNumber(totalProduced)}</div></div>
                </div>
                <div class="card">
                    <h3 class="card-title" style="margin-bottom:12px;">Produção por Tamanho</h3>
                    <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; text-align:center;">
                        <div style="background:var(--gray-50); padding:8px; border-radius:var(--radius);"><strong>P</strong><br>${formatNumber(totalP)}</div>
                        <div style="background:var(--gray-50); padding:8px; border-radius:var(--radius);"><strong>M</strong><br>${formatNumber(totalM)}</div>
                        <div style="background:var(--gray-50); padding:8px; border-radius:var(--radius);"><strong>G</strong><br>${formatNumber(totalG)}</div>
                        <div style="background:var(--gray-50); padding:8px; border-radius:var(--radius);"><strong>GG</strong><br>${formatNumber(totalGG)}</div>
                        <div style="background:var(--gray-50); padding:8px; border-radius:var(--radius);"><strong>XG</strong><br>${formatNumber(totalXG)}</div>
                    </div>
                </div>
                <div class="card">
                    <h3 class="card-title" style="margin-bottom:12px;">Produção por Referência</h3>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead><tr><th>REFERÊNCIA</th><th>TOTAL DE OCs</th><th>TOTAL DE PEÇAS</th></tr></thead>
                            <tbody>
                                ${Object.keys(refMap).length === 0 ? '<tr><td colspan="3" style="text-align:center;color:var(--gray-500);">Nenhum dado cadastrado.</td></tr>' : Object.keys(refMap).map(ref => `
                                    <tr>
                                        <td><strong>Ref. ${ref}</strong></td>
                                        <td>${refMap[ref].count} OCs</td>
                                        <td>${formatNumber(refMap[ref].total)} peças</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card">
                    <h3 class="card-title" style="margin-bottom:12px;">Produção por Oficina</h3>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead><tr><th>OFICINA</th><th>PEÇAS ENVIADAS</th><th>PEÇAS PRODUZIDAS</th><th>PENDENTE</th></tr></thead>
                            <tbody>
                                ${DB.workshops.map(w => {
                                    const shipmentsW = DB.shipments.filter(s => s.workshop === w.name).reduce((a,s)=>a+s.quantity,0);
                                    const ordersW = DB.production_orders.filter(o => o.workshop === w.name);
                                    const prodW = ordersW.reduce((a,o)=>a+o.produced,0);
                                    const pendW = ordersW.reduce((a,o)=>a+o.pending,0);
                                    return `<tr><td><strong>Oficina: ${w.name}</strong></td><td>${formatNumber(shipmentsW)}</td><td>${formatNumber(prodW)}</td><td>${formatNumber(pendW)}</td></tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        function renderUsers(container) {
            container.innerHTML = `<div class="page-header"><div><h1>Usuários</h1><span class="page-subtitle">Acessos do sistema (Marcos, Jéssica, Nildo)</span></div></div><div class="card"><div class="desktop-table-container table-responsive"><table class="data-table"><thead><tr><th>NOME</th><th>E-MAIL</th><th>PERFIL</th><th>STATUS</th></tr></thead><tbody>${DB.users.map(u=>`<tr><td><strong>${u.name}</strong></td><td>${u.email}</td><td><span class="badge badge-info">${u.role}</span></td><td><span class="badge badge-success">${u.status}</span></td></tr>`).join('')}</tbody></table></div></div>`;
        }
        function renderHistory(container) {
            container.innerHTML = `
                <div class="page-header"><div><h1>Histórico / Auditoria</h1><span class="page-subtitle">Trilha de eventos limpa e organizada</span></div></div>
                <div class="card">
                    <div class="desktop-table-container table-responsive">
                        <table class="data-table">
                            <thead><tr><th>DATA</th><th>HORA</th><th>USUÁRIO</th><th>AÇÃO</th><th>ALVO</th><th>DETALHES</th></tr></thead>
                            <tbody>
                                ${DB.audit_logs.length === 0 ? `<tr><td colspan="6" style="text-align:center; color:var(--gray-500); padding:20px;">Nenhum registro no histórico.</td></tr>` : DB.audit_logs.map(l=>`<tr><td>${l.date}</td><td>${l.time}</td><td>${l.user}</td><td><span class="badge badge-info">${l.action}</span></td><td><strong>${l.target}</strong></td><td>${l.details}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function handleGlobalSearch(q) {
            const dropdown = document.getElementById('search-results-dropdown');
            if (!q || q.length < 2) { dropdown.classList.add('hidden'); return; }
            let results = [];
            const query = q.toLowerCase();
            DB.production_orders.forEach(o => { 
                if(o.number.toLowerCase().includes(query) || o.reference.toLowerCase().includes(query) || (o.workshop && o.workshop.toLowerCase().includes(query))) {
                    results.push({title: `OC ${o.number} (Ref. ${o.reference})`, page: 'orders'}); 
                }
            });
            DB.cuts.forEach(c => { 
                if(c.number.toLowerCase().includes(query) || c.oc.toLowerCase().includes(query) || c.reference.toLowerCase().includes(query)) {
                    results.push({title: `Corte ${c.number} - OC ${c.oc}`, page: 'cuts'}); 
                }
            });
            if (results.length > 0) {
                dropdown.innerHTML = results.map(r => `<div class="search-result-item" onclick="navigateTo('${r.page}'); document.getElementById('search-results-dropdown').classList.add('hidden');">${r.title}</div>`).join('');
                dropdown.classList.remove('hidden');
            } else {
                dropdown.innerHTML = `<div class="search-result-item">Nenhum resultado encontrado.</div>`;
                dropdown.classList.remove('hidden');
            }
        }

        function toggleNotifications() { document.getElementById('notifications-dropdown').classList.toggle('hidden'); }
        function clearNotifications() { document.getElementById('notif-count').innerText = '0'; document.getElementById('notifications-dropdown').classList.add('hidden'); showToast('Notificações marcadas como lidas.'); }
    </script>
</body>
</html>
