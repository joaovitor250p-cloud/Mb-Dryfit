<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MB — Controle de Produção</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF & AutoTable via CDN for professional PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --warning: #ca8a04;
            --warning-light: #fefce8;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-600: #475569;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --sidebar-width: 260px;
            --topbar-height: 64px;
            --radius: 8px;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--gray-50);
            color: var(--gray-800);
            font-size: 14px;
            line-height: 1.5;
        }

        .hidden { display: none !important; }

        /* Login Screen */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 16px;
            width: 100%;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
        }
        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-logo {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            background: var(--primary);
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin: 0 auto 10px auto;
        }
        .login-header h1 { font-size: 18px; color: var(--gray-900); }
        .login-header p { color: var(--gray-600); font-size: 12px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 13px; color: var(--gray-800); }
        .input-icon { position: relative; width: 100%; }
        .input-icon i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
        .input-icon input, .form-group select, .form-group textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px 10px 38px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }
        .form-group select, .form-group textarea { padding-left: 12px; }
        .input-icon input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            min-height: 44px;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .error-message { color: var(--danger); font-size: 12px; margin-bottom: 10px; text-align: center; }
        .login-hints { margin-top: 16px; text-align: center; border-top: 1px solid var(--gray-200); padding-top: 12px; }
        .login-hints p { font-size: 12px; color: var(--gray-600); margin-bottom: 8px; }
        .hint-badge {
            background: var(--gray-100);
            border: 1px solid var(--gray-300);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin: 3px;
            display: inline-block;
            min-height: 38px;
        }
        .hint-badge:hover { background: var(--gray-200); }

        /* App Layout & Sidebar Mobile-First */
        .app-container { display: flex; min-height: 100vh; width: 100%; position: relative; }
        
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }
        .sidebar-overlay.active { display: block; }

        .sidebar {
            width: var(--sidebar-width);
            background: #ffffff;
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-header {
            height: var(--topbar-height);
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--gray-200);
        }
        .brand-logo-small {
            background: var(--primary);
            color: white;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border-radius: 6px;
            font-size: 14px;
        }
        .brand-info h2 { font-size: 15px; color: var(--gray-900); }
        .brand-info span { font-size: 10px; color: var(--gray-600); }
        
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px; }
        .nav-section { margin-bottom: 16px; }
        .nav-section-title { font-size: 10px; text-transform: uppercase; color: var(--gray-400); font-weight: 600; margin-bottom: 6px; padding-left: 8px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
            padding: 10px 12px;
            color: var(--gray-600);
            text-decoration: none;
            border-radius: var(--radius);
            font-weight: 500;
            margin-bottom: 2px;
            transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: var(--primary-light); color: var(--primary); }
        
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-profile-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .user-avatar {
            width: 34px;
            height: 34px;
            background: var(--gray-200);
            color: var(--gray-800);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 11px;
            flex-shrink: 0;
        }
        .user-details { min-width: 0; }
        .user-details span { display: block; font-weight: 600; font-size: 12px; color: var(--gray-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-details small { font-size: 10px; color: var(--gray-500); }
        .btn-logout { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; padding: 10px; border-radius: 4px; flex-shrink: 0; min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; }
        .btn-logout:hover { background: var(--danger-light); }

        /* Main Content & Header Mobile-First */
        .main-content {
            width: 100%;
            max-width: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding-bottom: 30px;
        }
        
        .topbar {
            background: #ffffff;
            border-bottom: 1px solid var(--gray-200);
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 90;
            width: 100%;
        }
        .topbar-row-1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }
        .topbar-left-mob {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar-logo-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--gray-900);
        }
        .topbar-right { display: flex; align-items: center; gap: 8px; }
        
        .global-search-container { position: relative; width: 100%; }
        .global-search-container i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
        .global-search-container input {
            width: 100%;
            min-height: 40px;
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            background: var(--gray-50);
            font-size: 13px;
            outline: none;
        }
        .global-search-container input:focus { background: #fff; border-color: var(--primary); }
        
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            margin-top: 4px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 110;
        }
        .search-result-item { padding: 12px 14px; border-bottom: 1px solid var(--gray-100); cursor: pointer; font-size: 13px; }
        .search-result-item:hover { background: var(--gray-50); }

        .icon-btn { position: relative; background: none; border: none; font-size: 18px; color: var(--gray-600); cursor: pointer; padding: 8px; border-radius: 50%; min-height: 40px; min-width: 40px; display: inline-flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: var(--gray-100); color: var(--gray-900); }
        
        .badge-counter {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 5px;
            border-radius: 10px;
        }
        
        .notifications-dropdown {
            position: absolute;
            right: 16px;
            top: 100%;
            width: calc(100vw - 32px);
            max-width: 320px;
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            z-index: 120;
        }
        .notif-header { padding: 12px 16px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .notif-header span { font-size: 11px; color: var(--primary); cursor: pointer; }
        .notif-item { padding: 12px 16px; border-bottom: 1px solid var(--gray-100); font-size: 13px; color: var(--gray-700); }
        .notif-item:last-child { border-bottom: none; }

        .page-content-area { padding: 16px; width: 100%; max-width: 100%; }

        /* UI Components Mobile First */
        .page-header { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 16px; gap: 10px; width: 100%; }
        .page-header h1 { font-size: 18px; color: var(--gray-900); font-weight: 700; }
        .page-subtitle { color: var(--gray-600); font-size: 12px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; width: 100%; }
        .stat-card { background: #fff; padding: 14px; border-radius: var(--radius); border: 1px solid var(--gray-200); box-shadow: var(--shadow); }
        .stat-card-title { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--gray-500); margin-bottom: 6px; }
        .stat-card-value { font-size: 20px; font-weight: 700; color: var(--gray-900); }

        .card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; box-shadow: var(--shadow); width: 100%; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
        .card-title { font-size: 15px; font-weight: 600; color: var(--gray-900); }

        /* Tables & Mobile Cards */
        .desktop-table-container { display: none; }
        .mobile-card-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .mobile-card-item { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .mobile-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray-100); padding-bottom: 8px; }
        .mobile-card-body { display: grid; grid-template-columns: 1fr; gap: 6px; font-size: 13px; }
        .mobile-card-body div span { color: var(--gray-500); display: inline-block; font-size: 11px; margin-right: 4px; }
        .mobile-card-footer { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--gray-100); padding-top: 8px; margin-top: 2px; flex-wrap: wrap; }

        /* Badges */
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block; text-align: center; }
        .badge-success { background: var(--success-light); color: var(--success); }
        .badge-warning { background: var(--warning-light); color: var(--warning); }
        .badge-danger { background: var(--danger-light); color: var(--danger); }
        .badge-info { background: var(--primary-light); color: var(--primary); }
        .badge-gray { background: var(--gray-100); color: var(--gray-600); }

        /* Modals */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 12px;
        }
        .modal-box {
            background: #fff;
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            max-height: 90vh;
            overflow-y: auto;
            padding: 16px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--gray-200); padding-bottom: 10px; }
        .modal-header h2 { font-size: 16px; color: var(--gray-900); }
        .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--gray-500); padding: 8px; min-height: 40px; min-width: 40px; display: flex; align-items: center; justify-content: center; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; border-top: 1px solid var(--gray-200); padding-top: 12px; flex-wrap: wrap; }

        /* Toasts */
        .toast-container { position: fixed; bottom: 16px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 32px); max-width: 350px; }
        .toast {
            background: var(--gray-900);
            color: #fff;
            padding: 12px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Timeline */
        .timeline { display: flex; flex-direction: column; gap: 12px; margin: 14px 0; position: relative; padding-left: 20px; border-left: 2px solid var(--gray-200); }
        .timeline-item { position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -25px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--gray-300); }
        .timeline-item.done::before { background: var(--success); }
        .timeline-item.active::before { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
        .timeline-title { font-weight: 600; font-size: 13px; color: var(--gray-900); }
        .timeline-date { font-size: 11px; color: var(--gray-500); }

        /* Desktop Media Query Enhancements */
        @media (min-width: 769px) {
            :root { --sidebar-width: 260px; }
            .sidebar { transform: translateX(0); }
            .sidebar-overlay { display: none !important; }
            .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); padding: 24px; }
            .topbar { flex-direction: row; justify-content: space-between; padding: 0 24px; height: var(--topbar-height); }
            .topbar-row-1 { width: auto; }
            .global-search-container { max-width: 400px; }
            .notifications-dropdown { right: 24px; width: 320px; }
            .page-header { flex-direction: row; justify-content: space-between; align-items: center; }
            .stats-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
            .desktop-table-container { display: block !important; }
            .mobile-card-list { display: none !important; }
            .modal-box { max-width: 800px; padding: 24px; }
            .toast-container { max-width: 400px; }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="brand-logo">MB</div>
                <h1>Controle de Produção</h1>
                <p>Faça login para acessar o sistema</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">E-mail</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" required placeholder="seu.email@mb.com">
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Senha</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" required placeholder="••••••">
                    </div>
                </div>
                <div id="login-error" class="error-message hidden">E-mail ou senha inválidos.</div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            <div class="login-hints">
                <p><strong>Acessos para Teste:</strong></p>
                <div>
                    <button type="button" class="hint-badge" onclick="fillLogin('admin@mb.com', '123456')">Marcos (ADMIN)</button>
                    <button type="button" class="hint-badge" onclick="fillLogin('transporte@mb.com', '123456')">Jéssica (TRANSPORTE)</button>
                    <button type="button" class="hint-badge" onclick="fillLogin('corte@mb.com', '123456')">Nildo (CORTE)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-container" class="app-container hidden">
        <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
        
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo-small">MB</div>
                <div class="brand-info">
                    <h2>MB</h2>
                    <span>Controle de Produção</span>
                </div>
                <button id="sidebar-close" class="icon-btn" onclick="toggleSidebar()" style="margin-left:auto;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Preenchido via JS -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-info">
                    <div class="user-avatar" id="user-avatar-initials">MA</div>
                    <div class="user-details">
                        <span id="sidebar-user-name">Marcos</span>
                        <small id="sidebar-user-role">ADMIN</small>
                    </div>
                </div>
                <button onclick="logout()" class="btn-logout" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </aside>

        <!-- Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-row-1">
                    <div class="topbar-left-mob">
                        <button id="sidebar-toggle" class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                        <div class="topbar-logo-text">MB</div>
                    </div>
                    <div class="topbar-right">
                        <div class="notifications-container" style="position:relative;">
                            <button class="icon-btn" onclick="toggleNotifications()">
                                <i class="fa-solid fa-bell"></i>
                                <span class="badge-counter" id="notif-count">3</span>
                            </button>
                            <div id="notifications-dropdown" class="notifications-dropdown hidden">
                                <div class="notif-header">
                                    <h3>Notificações</h3>
                                    <span onclick="clearNotifications()">Marcar lidas</span>
                                </div>
                                <div class="notif-list" id="notif-list">
                                    <div class="notif-item">✂️ Cortes prontos aguardando envio.</div>
                                    <div class="notif-item">🏭 OCs em produção nas oficinas.</div>
                                    <div class="notif-item">🎨 Peças aguardando no acabamento.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="global-search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="global-search" placeholder="Pesquisar OC, Corte, Referência..." oninput="handleGlobalSearch(this.value)">
                    <div id="search-results-dropdown" class="search-dropdown hidden"></div>
                </div>
            </header>

            <div id="page-content" class="page-content-area"></div>
        </main>
    </div>

    <!-- Modals & Toasts -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
        <div id="modal-container" class="modal-box"></div>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <!-- Application Script -->
    <script>
        // Data Mock & LocalStorage Persistence Layer

                    <div id="colors-container" style="display:flex; flex-direction:column; gap:10px; margin-bottom:12px;">
                        <!-- Rendered via JS -->
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; background:var(--gray-100); padding:12px; border-radius:var(--radius); margin-bottom:14px;">

                        <div style="text-align:right; display:flex; flex-direction:column; justify-content:center;">

        function renderColorRows() {
            const container = document.getElementById('colors-container');
            container.innerHTML = dynamicColors.map((item, idx) => `
                <div style="background:var(--gray-50); border:1px solid var(--gray-200); padding:10px; border-radius:var(--radius); display:flex; flex-direction:column; gap:8px;">
                    <div style="display:flex; gap:8px; align-items:center;">
                        <input type="text" placeholder="Nome da Cor (Ex: Preto)" value="${item.color}" oninput="updateColorField(${idx}, 'color', this.value)" required style="flex:2; min-height:38px;">
                        <input type="text" placeholder="Detalhes (Ex: Lisa)" value="${item.details}" oninput="updateColorField(${idx}, 'details', this.value)" style="flex:2; min-height:38px;">
                        ${dynamicColors.length > 1 ? `<button type="button" onclick="removeColorRow(${idx})" style="background:var(--danger); color:#fff; border:none; padding:8px 12px; border-radius:4px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                    <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:6px;">
                        <div><small style="font-size:10px;">P</small><input type="number" value="${item.p}" min="0" oninput="updateColorQty(${idx}, 'p', this.value)" style="text-align:center; min-height:36px; padding:4px;"></div>
                        <div><small style="font-size:10px;">M</small><input type="number" value="${item.m}" min="0" oninput="updateColorQty(${idx}, 'm', this.value)" style="text-align:center; min-height:36px; padding:4px;"></div>
                        <div><small style="font-size:10px;">G</small><input type="number" value="${item.g}" min="0" oninput="updateColorQty(${idx}, 'g', this.value)" style="text-align:center; min-height:36px; padding:4px;"></div>
                        <div><small style="font-size:10px;">GG</small><input type="number" value="${item.gg}" min="0" oninput="updateColorQty(${idx}, 'gg', this.value)" style="text-align:center; min-height:36px; padding:4px;"></div>
                        <div><small style="font-size:10px;">XG</small><input type="number" value="${item.xg}" min="0" oninput="updateColorQty(${idx}, 'xg', this.value)" style="text-align:center; min-height:36px; padding:4px;"></div>
                    </div>
                    <div style="text-align:right; font-size:12px; color:var(--gray-700);">Total da cor: <strong>${item.total}</strong></div>
                </div>
            `).join('');
            
            const totalGeral = dynamicColors.reduce((acc, curr) => acc + curr.total, 0);
            const previewEl = document.getElementById('modal-total-geral');
            if (previewEl) previewEl.innerText = formatNumber(totalGeral);
        }

        function addColorRow() {
            dynamicColors.push({ color: "", p: 0, m: 0, g: 0, gg: 0, xg: 0, details: "", total: 0 });
            renderColorRows();
        }

        function removeColorRow(idx) {
            dynamicColors.splice(idx, 1);
            renderColorRows();
        }

        function updateColorField(idx, field, val) {
            dynamicColors[idx][field] = val;
        }

        function updateColorQty(idx, field, val) {
            const num = parseInt(val) || 0;
            dynamicColors[idx][field] = num < 0 ? 0 : num;
            const c = dynamicColors[idx];
            c.total = c.p + c.m + c.g + c.gg + c.xg;
            renderColorRows();
        }

        function handleSaveCut(e) {
            e.preventDefault();
            const total = dynamicColors.reduce((acc, curr) => acc + curr.total, 0);
            if (total <= 0) {
                showToast('Adicione pelo menos uma cor com quantidade maior que zero.', 'error');
                return;
            }

            const ocVal = document.getElementById('cut-oc').value;
            const volumesVal = parseInt(document.getElementById('cut-volumes').value) || 1;

            const newCut = {
                id: DB.cuts.length + 1,
                number: `C-000${DB.cuts.length + 1}`,
                oc: ocVal,
                date: new Date().toISOString().split('T')[0],
                reference: document.getElementById('cut-ref').value,
                product: document.getElementById('cut-prod').value,
                fabric: document.getElementById('cut-fab').value,
                colors: JSON.parse(JSON.stringify(dynamicColors)),
                volumes: volumesVal,
                total: total,
                sent: 0,
                pending: total,
                status: "Aguardando corte",
                responsible: "Nildo",
                entry_date: document.getElementById('cut-entry-date').value,
                exit_date: document.getElementById('cut-exit-date').value,
                info_workshop: document.getElementById('cut-info').value,
                cut_date: document.getElementById('cut-date-val').value,
                stamp: document.getElementById('cut-stamp').value,
                stamp_date: document.getElementById('cut-stamp-date').value,
                obs: document.getElementById('cut-obs').value
            };

            DB.cuts.unshift(newCut);
            DB.audit_logs.unshift({ id: DB.audit_logs.length + 1, date: "16/09/2026", time: "15:00", user: "Nildo", action: "Novo corte", target: `OC ${ocVal}`, details: `Nildo cadastrou novo corte para a OC ${ocVal} com ${total} peças (${volumesVal} volumes).` });
            saveDB();
            closeModal();
            showToast('✓ Ficha da OC registrada com sucesso.');
            renderCuts(document.getElementById('page-content'));
        }

        function markCutReady(num) {
            const c = DB.cuts.find(x => x.number === num);
            if (!c) return;
            c.status = "✂️ Corte pronto";
            DB.audit_logs.unshift({ id: DB.audit_logs.length + 1, date: "16/09/2026", time: "15:30", user: "Nildo", action: "Corte pronto", target: `OC ${c.oc}`, details: `Nildo marcou o corte ${c.number} (OC ${c.oc}) como pronto.` });
            saveDB();
            showToast(`✓ Corte ${c.number} marcado como pronto.`);
            renderCuts(document.getElementById('page-content'));
        }

        function showCutDetails(num) {
            const c = DB.cuts.find(x => x.number === num);
            if (!c) return;
            showOrderDetails(c.oc);
        }

        // Transport Module (Only showing ready cuts)

                    <div class="desktop-table-container table-responsive">

                            <tbody>
                                ${readyCuts.length === 0 ? `<tr><td colspan="9" style="text-align:center; color:var(--gray-500); padding:20px;">Nenhum corte pronto no momento.</td></tr>` : readyCuts.map(c => `

                                        <td><strong>${c.number}</strong></td>

                                        <td>${c.reference}</td>

                                        <td>${formatNumber(c.pending)} peças</td>
                                        <td><span class="badge badge-success">${c.status}</span></td>
                                        <td><button class="btn-primary" style="padding:8px 14px; font-size:12px; min-height:38px;" onclick="openShipModal('${c.number}')">🚚 Enviar para Oficina</button></td>

                                `).join('')}

                                </div>
                            </div>
                        `).join('')}
                    </div>

            `;
        }

        function openShipModal(cutNumber) {
            const c = DB.cuts.find(x => x.number === cutNumber);
            openModal(`
                <div class="modal-header"><h2>Enviar ${c.number} (OC ${c.oc})</h2><button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
                <form onsubmit="handleSaveShipment(event, '${c.number}')">
                    <div class="form-group"><label>Oficina (Selecione da lista cadastrada)</label><select id="ship-workshop" required>${DB.workshops.map(w=>`<option value="${w.name}">Oficina: ${w.name} ${w.owner ? '(Resp: '+w.owner+')' : ''}</option>`).join('')}</select></div>
                    <div class="form-group">
                        <label>Quantidade de Peças a Enviar</label>
                        <small style="color:var(--gray-600); display:block; margin-bottom:4px;">Quantidade disponível: <strong>${c.pending}</strong></small>
                        <input type="number" id="ship-qty" max="${c.pending}" min="1" required value="${c.pending}" style="font-size:16px; font-weight:600;">
                    </div>
                    <div class="form-group"><label>Volumes Enviados</label><input type="number" id="ship-volumes" min="1" required value="${c.volumes || 1}"></div>
                    <div class="form-group"><label>Data</label><input type="date" id="ship-date" value="${new Date().toISOString().split('T')[0]}" required></div>
                    <div class="form-group"><label>Observação (Opcional)</label><textarea id="ship-obs"></textarea></div>
                    <div class="modal-footer"><button type="submit" class="btn-primary">Confirmar Envio</button></div>
                </form>
            `);
        }

        function handleSaveShipment(e, cutNum) {
            e.preventDefault();
            const qty = parseInt(document.getElementById('ship-qty').value);
            const volumesVal = parseInt(document.getElementById('ship-volumes').value) || 1;
            const workshop = document.getElementById('ship-workshop').value;
            const obs = document.getElementById('ship-obs').value;
            const c = DB.cuts.find(x => x.number === cutNum);
            const workshopObj = DB.workshops.find(w => w.name === workshop);

            if (qty > c.pending) {
                showToast(`Não é possível enviar ${qty} peças. Restam apenas ${c.pending}.`, 'error');
                return;
            }

            c.sent += qty;
            c.pending -= qty;
            c.status = c.pending === 0 ? "🚚 Enviado para oficina" : "🚚 Envio parcial";

            DB.shipments.push({ id: DB.shipments.length + 1, cut_number: c.number, oc: c.oc, workshop, quantity: qty, volumes: volumesVal, date: new Date().toISOString().split('T')[0], responsible: "Jéssica", observation: obs });
            
            let existingOC = DB.production_orders.find(o => o.number === c.oc);
            if (existingOC) {
                existingOC.total += qty;
                existingOC.pending += qty;
                existingOC.volumes = (existingOC.volumes || 0) + volumesVal;
                existingOC.workshop = workshop;
                existingOC.workshop_owner = workshopObj ? workshopObj.owner : '';
            } else {
                DB.production_orders.unshift({
                    id: DB.production_orders.length + 1,
                    number: c.oc,
                    date: c.date,
                    reference: c.reference,
                    product: c.product,
                    fabric: c.fabric,
                    workshop: workshop,
                    workshop_owner: workshopObj ? workshopObj.owner : '',
                    colors: JSON.parse(JSON.stringify(c.colors || [])),
                    volumes: volumesVal,
                    total: qty, produced: 0, pending: qty,
                    status: "🏭 Na oficina",
                    finishing_status: "Pendente",
                    entry_date: c.entry_date,
                    exit_date: c.exit_date,
                    info_workshop: c.info_workshop,
                    cut_date: c.cut_date,
                    stamp: c.stamp,
                    stamp_date: c.stamp_date,
                    obs: c.obs,
                    timeline: [
                        { step: "✂️ Corte pronto", date: "16/09 10:00" },
                        { step: "🚚 Enviado para oficina", date: "16/09 14:00" },
                        { step: "🏭 Na oficina", date: "16/09 14:10" }
                    ]
                });
            }

            DB.audit_logs.unshift({ id: DB.audit_logs.length + 1, date: "16/09/2026", time: "15:10", user: "Jéssica", action: "Enviado para oficina", target: `OC ${c.oc}`, details: `Jéssica enviou ${qty} peças (${volumesVal} volumes) do corte ${c.number} para Oficina: ${workshop}.` });

            saveDB();
            closeModal();
            showToast('✓ Envio registrado com sucesso.');
            renderTransport(document.getElementById('page-content'));
        }

        // Orders (OCs) Module with Full Pipeline
        function renderOrders(container) {

                                            ${o.status === '✓ Oficina pronta' && (currentUser.role === 'TRANSPORTE' || currentUser.role === 'ADMIN') ? `<button class="btn-primary" style="padding:6px 10px; font-size:11px; min-height:36px;" onclick="sendToFinishing('${o.number}')">🚚 Enviar Acabamento</button>` : ''}
                                            ${o.status === '🚚 Enviando para acabamento' && (currentUser.role === 'TRANSPORTE' || currentUser.role === 'ADMIN') ? `<button class="btn-primary" style="background:var(--success); padding:6px 10px; font-size:11px; min-height:36px;" onclick="arriveFinishing('${o.number}')">🎨 Chegou Acabamento</button>` : ''}
                                            ${o.status === '🎨 Chegou no acabamento' && currentUser.role === 'ADMIN' ? `<button class="btn-primary" style="background:var(--success); padding:6px 10px; font-size:11px; min-height:36px;" onclick="markOCReady('${o.number}')">📦 OC Pronta</button>` : ''}
                                            <button class="btn-primary" style="background:var(--success); padding:6px 10px; font-size:11px; min-height:36px;" onclick="downloadOCPDF('${o.number}')">⬇ Baixar OC</button>

                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div class="mobile-card-list">
                        ${DB.production_orders.map(o => {

                                    <div class="mobile-card-body" style="grid-template-columns: 1fr;">

                                        <div><span>Produto:</span>👕 ${o.product} (Ref. ${o.reference}) | 🧵 ${o.fabric}</div>

                                        ${o.status === '✓ Oficina pronta' && (currentUser.role === 'TRANSPORTE' || currentUser.role === 'ADMIN') ? `<button class="btn-primary" style="padding:8px 12px; font-size:12px; min-height:40px;" onclick="sendToFinishing('${o.number}')">🚚 Enviar Acabamento</button>` : ''}
                                        ${o.status === '🚚 Enviando para acabamento' && (currentUser.role === 'TRANSPORTE' || currentUser.role === 'ADMIN') ? `<button class="btn-primary" style="background:var(--success); padding:8px 12px; font-size:12px; min-height:40px;" onclick="arriveFinishing('${o.number}')">🎨 Chegou Acabamento</button>` : ''}

            if (!o) return;
            o.status = "📦 OC pronta";

        // PDF Generation Function using jsPDF + AutoTable
        function downloadOCPDF(num) {
            const o = DB.production_orders.find(x => x.number === num);
            if (!o) {
                showToast(`OC ${num} não encontrada para exportação.`, 'error');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

            // Header Banner
            doc.setFillColor(37, 99, 235);
            doc.rect(14, 14, 182, 16, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(14);
            doc.setFont('inter', 'bold');
            doc.text('MB — FICHA DE PRODUÇÃO', 18, 25);

            // Metadata Box
            doc.setDrawColor(203, 213, 225);
            doc.setFillColor(248, 250, 252);
            doc.roundedRect(14, 34, 182, 36, 2, 2, 'FD');

            doc.setTextColor(30, 41, 59);
            doc.setFontSize(10);
            doc.setFont('inter', 'bold');
            doc.text(`NÚMERO DA OC: ${o.number}`, 18, 42);
            doc.text(`REFERÊNCIA: ${o.reference}`, 80, 42);
            doc.text(`PRODUTO / MODELO: ${o.product}`, 140, 42);

            doc.setFont('inter', 'normal');
            doc.text(`Oficina: ${o.workshop} ${o.workshop_owner ? '(Resp: '+o.workshop_owner+')' : ''}`, 18, 50);
            doc.text(`Status Atual: ${o.status}`, 110, 50);

            doc.text(`Data Entrada: ${formatDate(o.entry_date || o.date)}`, 18, 58);
            doc.text(`Data Saída: ${formatDate(o.exit_date || '')}`, 80, 58);
            doc.text(`Volumes: ${o.volumes || 1}`, 140, 58);

            // Secondary Info Box
            doc.roundedRect(14, 74, 182, 26, 2, 2, 'FD');
            doc.text(`Corte Data: ${formatDate(o.cut_date || '')}`, 18, 81);
            doc.text(`Estampa: ${o.stamp || 'Não'} (${formatDate(o.stamp_date || '')})`, 80, 81);
            doc.text(`Info Oficina: ${o.info_workshop || 'Nenhuma'}`, 18, 89);
            doc.text(`Observações: ${o.obs || 'Nenhuma'}`, 18, 96);

            // Colors Table
            let tableBody = [];
            let sumP = 0, sumM = 0, sumG = 0, sumGG = 0, sumXG = 0;

            if (o.colors && o.colors.length > 0) {
                o.colors.forEach(col => {
                    tableBody.push([
                        col.color || 'Padrão',
                        col.p || 0,
                        col.m || 0,
                        col.g || 0,
                        col.gg || 0,
                        col.xg || 0,
                        col.details || '-',
                        col.total || 0
                    ]);
                    sumP += (col.p || 0);
                    sumM += (col.m || 0);
                    sumG += (col.g || 0);
                    sumGG += (col.gg || 0);
                    sumXG += (col.xg || 0);
                });
            } else {
                tableBody.push([
                    'Padrão', o.p || 0, o.m || 0, o.g || 0, o.gg || 0, 0, '-', o.total || 0
                ]);
                sumP += (o.p || 0);
                sumM += (o.m || 0);
                sumG += (o.g || 0);
                sumGG += (o.gg || 0);
            }

            doc.autoTable({
                startY: 104,
                head: [['COR', 'P', 'M', 'G', 'GG', 'XG', 'DETALHES', 'TOTAL']],
                body: tableBody,
                theme: 'grid',
                headStyles: { fillColor: [37, 99, 235], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 9 },
                bodyStyles: { fontSize: 9, textColor: [30, 41, 59] },
                columnStyles: {
                    0: { cellWidth: 35 },
                    1: { cellWidth: 15, halign: 'center' },
                    2: { cellWidth: 15, halign: 'center' },
                    3: { cellWidth: 15, halign: 'center' },
                    4: { cellWidth: 15, halign: 'center' },
                    5: { cellWidth: 15, halign: 'center' },
                    6: { cellWidth: 47 },
                    7: { cellWidth: 25, halign: 'center', fontStyle: 'bold' }
                }
            });

            const finalY = doc.lastAutoTable.finalY + 6;

            // Totals Footer Box
            doc.setFillColor(241, 245, 249);
            doc.roundedRect(14, finalY, 182, 18, 2, 2, 'FD');
            doc.setFont('inter', 'bold');
            doc.setFontSize(9);
            doc.text(`TOTAIS -> P: ${sumP} | M: ${sumM} | G: ${sumG} | GG: ${sumGG} | XG: ${sumXG}`, 18, finalY + 7);
            doc.text(`TOTAL GERAL DE PEÇAS: ${o.total}  |  VOLUMES: ${o.volumes || 1}`, 18, finalY + 14);

            doc.save(`OC-${o.number}.pdf`);
            showToast(`✓ Download do PDF da OC ${o.number} realizado com sucesso.`);
        }

        function handleGlobalSearch(q) {
            const dropdown = document.getElementById('search-results-dropdown');
            if (!q || q.length < 2) { dropdown.classList.add('hidden'); return; }
            let results = [];
            DB.production_orders.forEach(o => { if(o.number.toLowerCase().includes(q.toLowerCase())) results.push({title: `OC ${o.number}`, page: 'orders'}); });
            DB.cuts.forEach(c => { if(c.number.toLowerCase().includes(q.toLowerCase())) results.push({title: `Corte ${c.number}`, page: 'cuts'}); });
            if (results.length > 0) {
                dropdown.innerHTML = results.map(r => `<div class="search-result-item" onclick="navigateTo('${r.page}'); document.getElementById('search-results-dropdown').classList.add('hidden');">${r.title}</div>`).join('');
                dropdown.classList.remove('hidden');
            } else {
                dropdown.innerHTML = `<div class="search-result-item">Nenhum resultado encontrado.</div>`;
                dropdown.classList.remove('hidden');
            }
        }

        function toggleNotifications() { document.getElementById('notifications-dropdown').classList.toggle('hidden'); }
        function clearNotifications() { document.getElementById('notif-count').innerText = '0'; document.getElementById('notifications-dropdown').classList.add('hidden'); showToast('Notificações marcadas como lidas.'); }
    </script>
</body>
</html>
