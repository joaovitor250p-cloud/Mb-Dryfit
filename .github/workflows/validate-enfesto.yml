name: Validar Enfesto antes de publicar

on:
  push:
    branches:
      - feat/enfesto-fichas-producao-20261112
  pull_request:
    paths:
      - 'src/EnfestoPage.tsx'
      - 'src/ProtectedEnfestoOcs.tsx'
      - 'tests/protected-enfesto-ocs.test.cjs'
      - 'src/ProductionSheets.tsx'
      - 'src/ProductionCleanup.tsx'
      - 'src/SheetPrint.tsx'
      - 'src/CutOrders.tsx'
      - 'src/lib/sheetOcSequence.ts'
      - 'tests/sheet-oc-workflow.test.cjs'
      - 'src/lib/sheetCatalogAutofill.ts'
      - 'tests/sheet-autofill-print-ui.test.cjs'
      - 'src/lib/enfestoWorkflow.ts'
      - 'src/lib/purchasesInventory.ts'
      - 'firestore.rules'
      - 'tests/enfesto-workflow.test.cjs'
      - '.github/workflows/validate-enfesto.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Preparar Java para validar regras Firestore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validar regras Firestore no emulador sem publicar
        run: npx --yes firebase-tools@13.35.1 emulators:exec --project demo-mb-referencias --only firestore 'echo Regras-Firestore-validas'
      - name: Testes de Enfesto e regressão
        run: node --test tests/enfesto-workflow.test.cjs tests/purchases-inventory.test.cjs tests/sheets-office-distribution.test.cjs tests/sheet-autofill-print-ui.test.cjs tests/sheet-oc-workflow.test.cjs tests/protected-enfesto-ocs.test.cjs tests/mauro-price.test.cjs tests/payment-delivered-visibility.test.cjs
      - name: Verificar TypeScript e compilar
        run: npm run build
