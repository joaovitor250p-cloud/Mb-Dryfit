name: Validar sintaxe das regras Firestore

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - .github/workflows/validate-firestore-main.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências e testes de regras
        run: |
          npm install
          npm install --no-save --no-package-lock @firebase/rules-unit-testing@4.0.1
      - name: Compilar regras e executar testes no emulador sem publicar
        run: npx --yes firebase-tools@13.35.1 emulators:exec --project demo-mb-referencias --only firestore 'node --test tests/enfesto-permissions.integration.cjs'
