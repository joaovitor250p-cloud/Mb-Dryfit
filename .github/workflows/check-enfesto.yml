name: Validar fluxo de Enfesto

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/enfesto-fichas-estoque-20261112]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Testar distribuição, estoque e Enfesto
        run: node --test tests/enfesto-flow.test.cjs tests/sheets-office-distribution.test.cjs tests/purchases-inventory.test.cjs
      - name: Compilar site (TypeScript e Vite)
        run: npm run build
